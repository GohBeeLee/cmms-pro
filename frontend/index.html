// ── Assets ─────────────────────────────────────────────────────────────────
function Assets(){
  const [assets,setAssets]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [modal,setModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [importModal,setImportModal]=useState(false);
  const [importResult,setImportResult]=useState(null);
  const [importing,setImporting]=useState(false);
  const importFileRef=useRef(null);
  const emptyForm={asset_code:'',name:'',category:'',location:'',manufacturer:'',model:'',serial_number:'',status:'operational',notes:''};
  const [form,setForm]=useState(emptyForm);
  const CATS=['Pump','Motor','Compressor','Conveyor','HVAC','Generator','Other'];
  const STATS=['operational','under_maintenance','out_of_service','decommissioned'];

  async function load(){try{setAssets(await api('/assets/'));}catch(e){toast(e.message,'err');}finally{setLoading(false);}}
  useEffect(()=>{load();},[]);
  useWS('assets',load);

  async function save(){
    try{
      if(editing) await api('/assets/'+editing.id,{method:'PATCH',body:JSON.stringify(form)});
      else await api('/assets/',{method:'POST',body:JSON.stringify(form)});
      toast(editing?'Asset updated':'Asset created');setModal(false);setEditing(null);load();
    }catch(e){toast(e.message,'err');}
  }

  async function decommission(id,name){
    if(!confirm('Mark "'+name+'" as decommissioned?\nThis preserves all work order history.')) return;
    try{
      await api('/assets/'+id,{method:'PATCH',body:JSON.stringify({status:'decommissioned'})});
      toast('Asset marked as decommissioned');load();
    }catch(e){toast(e.message,'err');}
  }

  async function hardDel(id,name){
    if(!confirm('PERMANENTLY DELETE "'+name+'"?\n\nThis will fail if work orders are linked.\nUse Decommission to preserve history.')) return;
    try{
      await api('/assets/'+id,{method:'DELETE'});
      toast('Asset deleted');load();
    }catch(e){
      toast('Cannot delete — asset has linked work orders. Use Decommission instead.','err');
    }
  }

  // ── Excel import ────────────────────────────────────────────────────────
  async function handleImport(e){
    const file = e.target.files[0];
    if (!file) return;
    if (!file.name.endsWith('.xlsx')){toast('Please select an .xlsx file','err');return;}
    setImporting(true);
    setImportResult(null);
    setImportModal(true);
    try{
      // File uploads need multipart/form-data — use FormData, NOT the api() helper
      const token = localStorage.getItem('cmms_token');
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch(window.API_BASE+'/data/import/assets', {
        method:'POST',
        headers:{ Authorization:'Bearer '+token },
        // DO NOT set Content-Type — browser sets it automatically with boundary
        body: formData,
      });
      if (!res.ok){
        const err = await res.json().catch(()=>({}));
        throw new Error(err.detail||'Import failed');
      }
      const result = await res.json();
      setImportResult(result);
      load();
    }catch(ex){
      setImportResult({error:ex.message});
    }finally{
      setImporting(false);
      e.target.value=''; // reset file input
    }
  }

  const filtered=assets.filter(a=>
    a.name.toLowerCase().includes(search.toLowerCase())||
    a.asset_code.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div>
          <h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>Assets</h1>
          <p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>Machines and equipment</p>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          {/* Download template */}
          <button className="btn btn-secondary" style={{fontSize:'13px'}} onClick={()=>downloadFile('/data/import/template','CMMS_Asset_Import_Template.xlsx')}>
              📥 Download Template
            </button>
          {/* Import from Excel */}
          <label style={{cursor:'pointer'}}>
            <span className="btn btn-secondary" style={{fontSize:'13px',display:'inline-block'}}>
              {importing ? '⏳ Importing…' : '📤 Import Excel'}
            </span>
            <input
              ref={importFileRef}
              type="file"
              accept=".xlsx"
              style={{display:'none'}}
              onChange={handleImport}
              disabled={importing}
            />
          </label>
          <button className="btn btn-primary" style={{fontSize:'13px'}} onClick={()=>{setEditing(null);setForm(emptyForm);setModal(true);}}>
            + Add Asset
          </button>
        </div>
      </div>

      <input className="inp" style={{maxWidth:'280px',marginBottom:'16px'}} placeholder="Search assets…" value={search} onChange={e=>setSearch(e.target.value)}/>

      <div className="card" style={{padding:0}}>
        {loading?<Spinner/>:filtered.length===0?<Empty msg="No assets found"/>:(
          <div className="ovf"><table>
            <thead><tr>{['Code','Name','Category','Location','Status','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{filtered.map(a=>(
              <tr key={a.id}>
                <td><span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px'}}>{a.asset_code}</span></td>
                <td style={{fontWeight:600}}>{a.name}</td>
                <td style={{color:'#64748b'}}>{a.category}</td>
                <td style={{color:'#64748b'}}>{a.location}</td>
                <td><Badge value={a.status}/></td>
                <td style={{whiteSpace:'nowrap'}}>
                  <button onClick={()=>{setEditing(a);setForm({...emptyForm,...a});setModal(true);}}
                    style={{color:'#2563eb',background:'none',border:'none',cursor:'pointer',fontSize:'12px',marginRight:'8px'}}>Edit</button>
                  <button onClick={()=>decommission(a.id,a.name)}
                    style={{color:'#d97706',background:'none',border:'none',cursor:'pointer',fontSize:'12px',marginRight:'8px'}}>Decommission</button>
                  <button onClick={()=>hardDel(a.id,a.name)}
                    style={{color:'#dc2626',background:'none',border:'none',cursor:'pointer',fontSize:'12px'}}>Delete</button>
                </td>
              </tr>
            ))}</tbody>
          </table></div>
        )}
      </div>

      {/* Add/Edit modal */}
      {modal&&(
        <Modal title={editing?'Edit Asset':'Add Asset'} onClose={()=>setModal(false)}>
          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
            {[['asset_code','Asset Code *',!!editing],['name','Name *'],['location','Location *'],['manufacturer','Manufacturer'],['model','Model'],['serial_number','Serial Number']].map(([k,lbl,dis])=>(
              <div key={k}><label className="lbl">{lbl}</label>
                <input className="inp" disabled={!!dis} value={form[k]||''} onChange={e=>setForm({...form,[k]:e.target.value})}/>
              </div>
            ))}
            <div><label className="lbl">Category</label>
              <select className="inp" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
                <option value="">Select…</option>{CATS.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div><label className="lbl">Status</label>
              <select className="inp" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                {STATS.map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
              </select>
            </div>
            <div><label className="lbl">Notes</label>
              <textarea className="inp" rows={3} value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})}/>
            </div>
            <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={save}>Save</button>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setModal(false)}>Cancel</button>
            </div>
          </div>
        </Modal>
      )}

      {/* Import result modal */}
      {importModal&&(
        <Modal title="Excel Import Result" onClose={()=>setImportModal(false)}>
          {importing?(
            <div style={{textAlign:'center',padding:'30px'}}>
              <Spinner/>
              <div style={{color:'#64748b',fontSize:'14px',marginTop:'8px'}}>Importing assets…</div>
            </div>
          ):importResult&&(
            <div>
              {importResult.error?(
                <div style={{background:'#fee2e2',color:'#991b1b',padding:'14px',borderRadius:'10px',marginBottom:'12px'}}>
                  ❌ {importResult.error}
                </div>
              ):(
                <div>
                  <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'10px',padding:'16px',marginBottom:'16px'}}>
                    <div style={{fontWeight:700,color:'#16a34a',marginBottom:'8px'}}>✅ Import Complete</div>
                    <div style={{fontSize:'14px',color:'#374151',lineHeight:2}}>
                      <div>📥 <strong>{importResult.inserted}</strong> new assets inserted</div>
                      <div>✏️ <strong>{importResult.updated}</strong> existing assets updated</div>
                      <div>⏭️ <strong>{importResult.skipped}</strong> rows skipped</div>
                    </div>
                  </div>
                  {importResult.skipped_details&&importResult.skipped_details.length>0&&(
                    <div>
                      <div style={{fontWeight:600,color:'#374151',marginBottom:'8px',fontSize:'13px'}}>Skipped rows:</div>
                      {importResult.skipped_details.map((s,i)=>(
                        <div key={i} style={{fontSize:'12px',color:'#dc2626',padding:'4px 8px',background:'#fef2f2',borderRadius:'6px',marginBottom:'4px'}}>
                          Row {s.row}: {s.reason}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
              <button className="btn btn-primary" style={{width:'100%',marginTop:'12px'}} onClick={()=>setImportModal(false)}>Close</button>
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

// ── Parts & Scanner (combined list + barcode scan/move) ───────────────────
function PartsAndScannerTab({canManage}){
  const [parts,setParts]=useState([]);
  const [categories,setCategories]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [catFilter,setCatFilter]=useState('');
  const [lowOnly,setLowOnly]=useState(false);
  const [modal,setModal]=useState(false);
  const [editPart,setEditPart]=useState(null);
  const [importModal,setImportModal]=useState(false);
  const [importResult,setImportResult]=useState(null);
  const [importing,setImporting]=useState(false);
  const importRef=useRef(null);
  // ── Photo upload ──
  const [photoModal,setPhotoModal]=useState(null); // part being photographed
  const [photoPreview,setPhotoPreview]=useState('');
  const [photoUploading,setPhotoUploading]=useState(false);
  const photoFileRef=useRef(null);
  const [lightboxPhoto,setLightboxPhoto]=useState(null); // {url,name} for full-size view

  // ── Scanner state ──
  const [scanOpen,setScanOpen]=useState(false);
  const [mode,setMode]=useState('out'); // 'in' | 'out'
  const [barcode,setBarcode]=useState('');
  const [scanning,setScanning]=useState(false);
  const [scanPart,setScanPart]=useState(null);
  const [qty,setQty]=useState(1);
  const [reason,setReason]=useState('');
  const [reference,setReference]=useState('');
  const [moveResult,setMoveResult]=useState(null);
  const barcodeRef=useRef(null);
  // ── Camera scanning ──
  const [cameraOpen,setCameraOpen]=useState(false);
  const [cameraError,setCameraError]=useState('');
  const [cameraStarting,setCameraStarting]=useState(false);
  const html5QrRef=useRef(null);
  const cameraStartedRef=useRef(false);

  const emptyForm={
    part_code:'',name:'',category:'',description:'',unit:'pcs',
    quantity_on_hand:0,reorder_level:5,unit_cost:'',
    supplier:'',location:'',barcode:'',used_on_asset:'',
  };
  const [form,setForm]=useState(emptyForm);
  const [formPhoto,setFormPhoto]=useState(''); // base64 data URL for the Add/Edit Part modal
  const formPhotoFileRef=useRef(null);

  async function load(){
    try{
      let url='/inventory/?low_stock='+lowOnly;
      if(catFilter) url+='&category='+encodeURIComponent(catFilter);
      const [p,cats]=await Promise.all([api(url),api('/inventory/categories')]);
      setParts(p);
      setCategories(cats);
    }catch(e){toast(e.message,'err');}
    finally{setLoading(false);}
  }
  useEffect(()=>{load();},[lowOnly,catFilter]);
  useWS('inventory',load);

  useEffect(()=>{ if(scanOpen) setTimeout(()=>barcodeRef.current?.focus(),150); },[scanOpen]);
  useEffect(()=>{
    return ()=>{
      if(html5QrRef.current&&cameraStartedRef.current){
        html5QrRef.current.stop().then(()=>html5QrRef.current.clear()).catch(()=>{});
      }
    };
  },[]);

  async function handleFormPhotoSelect(e){
    const file=e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){toast('Please select an image file','err');return;}
    try{
      const dataUrl=await resizeImage(file);
      setFormPhoto(dataUrl);
    }catch(err){toast('Could not process image','err');}
    finally{e.target.value='';}
  }

  async function save(){
    if(!canManage){toast('Only admins and managers can edit parts','err');return;}
    try{
      const p={
        ...form,
        quantity_on_hand:parseInt(form.quantity_on_hand)||0,
        reorder_level:parseInt(form.reorder_level)||5,
        unit_cost:form.unit_cost?parseFloat(form.unit_cost):null,
      };
      let savedPart;
      if(editPart){
        savedPart=await api('/inventory/'+editPart.id,{method:'PATCH',body:JSON.stringify(p)});
        toast('Part updated');
      } else {
        savedPart=await api('/inventory/',{method:'POST',body:JSON.stringify(p)});
        toast('Part added');
      }
      // If a photo was selected (or changed) in the form, upload it right after saving the part
      if(formPhoto&&formPhoto!==editPart?.photo_url){
        try{
          await api('/inventory/'+savedPart.id+'/photo',{method:'PUT',body:JSON.stringify({data:formPhoto})});
        }catch(photoErr){toast('Part saved, but photo upload failed: '+photoErr.message,'err');}
      }
      setModal(false);setEditPart(null);setForm(emptyForm);setFormPhoto('');load();
    }catch(e){toast(e.message,'err');}
  }

  async function del(id,name){
    if(!canManage){toast('Only admins and managers can delete parts','err');return;}
    if(!confirm('Delete part "'+name+'"?')) return;
    try{await api('/inventory/'+id,{method:'DELETE'});toast('Deleted');load();}
    catch(e){toast(e.message,'err');}
  }

  async function handleImport(e){
    if(!canManage){toast('Only admins and managers can import parts','err');e.target.value='';return;}
    const file=e.target.files[0];
    if(!file) return;
    if(!file.name.endsWith('.xlsx')){toast('Please select an .xlsx file','err');return;}
    setImporting(true);setImportResult(null);setImportModal(true);
    try{
      const token=localStorage.getItem('cmms_token');
      const fd=new FormData();
      fd.append('file',file);
      const res=await fetch(window.API_BASE+'/inventory/import/excel',{
        method:'POST',
        headers:{Authorization:'Bearer '+token},
        body:fd,
      });
      if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.detail||'Import failed');}
      setImportResult(await res.json());
      load();
    }catch(ex){setImportResult({error:ex.message});}
    finally{setImporting(false);e.target.value='';}
  }

  // ── Photo upload (resize client-side to keep payload small) ──
  function openPhotoModal(part){
    setPhotoModal(part);
    setPhotoPreview(part.photo_url||'');
  }
  function closePhotoModal(){setPhotoModal(null);setPhotoPreview('');}

  function resizeImage(file,maxDim=800,quality=0.75){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>{
        const img=new Image();
        img.onload=()=>{
          let {width,height}=img;
          if(width>height&&width>maxDim){height=Math.round(height*maxDim/width);width=maxDim;}
          else if(height>maxDim){width=Math.round(width*maxDim/height);height=maxDim;}
          const canvas=document.createElement('canvas');
          canvas.width=width;canvas.height=height;
          canvas.getContext('2d').drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL('image/jpeg',quality));
        };
        img.onerror=()=>reject(new Error('Could not read image'));
        img.src=reader.result;
      };
      reader.onerror=()=>reject(new Error('Could not read file'));
      reader.readAsDataURL(file);
    });
  }

  async function handlePhotoSelect(e){
    const file=e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){toast('Please select an image file','err');return;}
    try{
      const dataUrl=await resizeImage(file);
      setPhotoPreview(dataUrl);
    }catch(err){toast('Could not process image','err');}
    finally{e.target.value='';}
  }

  async function savePhoto(){
    if(!photoModal||!photoPreview) return;
    setPhotoUploading(true);
    try{
      await api('/inventory/'+photoModal.id+'/photo',{method:'PUT',body:JSON.stringify({data:photoPreview})});
      toast('Photo saved');
      closePhotoModal();
      load();
    }catch(e){toast(e.message,'err');}
    finally{setPhotoUploading(false);}
  }

  async function removePhoto(){
    if(!photoModal) return;
    if(!confirm('Remove this photo?')) return;
    setPhotoUploading(true);
    try{
      await api('/inventory/'+photoModal.id+'/photo',{method:'DELETE'});
      toast('Photo removed');
      closePhotoModal();
      load();
    }catch(e){toast(e.message,'err');}
    finally{setPhotoUploading(false);}
  }

  // ── Scanner logic ──
  async function lookupBarcode(code){
    const b=(code||barcode).trim();
    if(!b) return;
    setScanning(true);setScanPart(null);setMoveResult(null);setQty(1);setReason('');setReference('');
    try{
      const data=await api('/stock/scan/'+encodeURIComponent(b));
      setScanPart(data);
      setTimeout(()=>document.getElementById('qty-input')?.focus(),100);
    }catch(e){toast(e.message,'err');setScanPart(null);}
    finally{setScanning(false);}
  }
  function onBarcodeKey(e){ if(e.key==='Enter'){e.preventDefault();lookupBarcode();} }

  // ── Camera-based barcode scanning (phone camera via html5-qrcode) ──
  async function startCamera(){
    if(typeof Html5Qrcode==='undefined'){
      setCameraError('Camera scanner library failed to load. Check your internet connection.');
      return;
    }
    setCameraOpen(true);setCameraError('');setCameraStarting(true);
    setTimeout(async()=>{
      try{
        if(!html5QrRef.current) html5QrRef.current=new Html5Qrcode('camera-view',{
          // Use the browser's fast native barcode decoder on devices that
          // support it (most Android Chrome). Falls back to the JS decoder
          // automatically if unsupported (e.g. iOS Safari).
          useBarCodeDetectorIfSupported:true,
          verbose:false,
        });
        const config={
          fps:8, // lower fps gives the camera more time to focus each frame — improves 1D barcode reads
          // Wide rectangular box matches the shape of real barcodes (EAN/UPC/Code128)
          // far better than a square box, which is the #1 reason 1D barcodes fail to scan.
          qrbox:(vw,vh)=>{
            const w=Math.floor(Math.min(vw,vh)*0.85);
            return {width:w,height:Math.floor(w*0.4)};
          },
          aspectRatio:1.7777778, // 16:9 — wider view helps fit a barcode fully in frame
          disableFlip:false,
          // Deliberately NOT setting formatsToSupport: restricting formats is
          // unreliable across library versions/platforms and can silently
          // break detection entirely. Leaving it unset scans all supported
          // formats (QR, EAN, UPC, Code128/39/93, ITF, etc.)
        };
        await html5QrRef.current.start(
          {facingMode:'environment'},
          config,
          (decodedText)=>{ onCameraDetected(decodedText); },
          ()=>{ /* per-frame decode miss — ignore, this fires constantly while scanning */ },
        );
        cameraStartedRef.current=true;
      }catch(err){
        setCameraError(
          err && err.toString && err.toString().includes('NotAllowedError')
            ? 'Camera permission denied. Please allow camera access and try again.'
            : 'Could not start camera: '+(err?.message||err)
        );
        cameraStartedRef.current=false;
      }finally{
        setCameraStarting(false);
      }
    },50);
  }

  async function stopCamera(){
    try{
      if(html5QrRef.current&&cameraStartedRef.current){
        await html5QrRef.current.stop();
        html5QrRef.current.clear();
      }
    }catch(e){/* already stopped */}
    cameraStartedRef.current=false;
    setCameraOpen(false);setCameraError('');
  }

  function onCameraDetected(decodedText){
    if(!decodedText) return;
    stopCamera();
    setBarcode(decodedText);
    lookupBarcode(decodedText);
  }

  async function submitMove(){
    if(!scanPart){toast('Please scan a part first','err');return;}
    if(qty<1){toast('Quantity must be at least 1','err');return;}
    if(mode==='out'&&qty>scanPart.quantity_on_hand){
      toast(`Only ${scanPart.quantity_on_hand} ${scanPart.unit||'pcs'} available`,'err');return;
    }
    try{
      const endpoint=mode==='in'?'/stock/in':'/stock/out';
      const data=await api(endpoint,{method:'POST',body:JSON.stringify({part_id:scanPart.id,quantity:qty,reason:reason||null,reference:reference||null})});
      setMoveResult(data);
      toast(data.message,data.low_stock?'err':'ok');
      setScanPart(data.part);
      setQty(1);setReason('');setReference('');setBarcode('');
      setTimeout(()=>barcodeRef.current?.focus(),200);
      load();
    }catch(e){toast(e.message,'err');}
  }

  function openScanner(prefillBarcode){
    setScanOpen(true);setScanPart(null);setMoveResult(null);setBarcode(prefillBarcode||'');setQty(1);setReason('');setReference('');
    if(prefillBarcode) setTimeout(()=>lookupBarcode(prefillBarcode),50);
  }
  function closeScanner(){stopCamera();setScanOpen(false);setScanPart(null);setMoveResult(null);setBarcode('');}

  const filtered=parts.filter(p=>
    p.name.toLowerCase().includes(search.toLowerCase())||
    (p.part_code||'').toLowerCase().includes(search.toLowerCase())||
    (p.description||'').toLowerCase().includes(search.toLowerCase())
  );
  const topupCount=filtered.filter(p=>p.is_low_stock).length;

  return (

      {/* Action bar */}
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'16px'}}>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>

          </button>
          {canManage&&<>
            <button className="btn btn-secondary" style={{fontSize:'13px'}} onClick={()=>downloadFile('/inventory/import/template','CMMS_Inventory_Import_Template.xlsx')}>
              📥 Template
            </button>
            <label style={{cursor:'pointer'}}>
              <span className="btn btn-secondary" style={{fontSize:'13px',display:'inline-block',background:importing?'#f1f5f9':'#fff'}}>

              <input ref={importRef} type="file" accept=".xlsx" style={{display:'none'}} onChange={handleImport} disabled={importing}/>
            </label>
            <button className="btn btn-secondary" style={{fontSize:'13px'}} onClick={()=>{
                const qs=(catFilter?'?category='+encodeURIComponent(catFilter):'')+(lowOnly?(catFilter?'&':'?')+'low_stock=true':'');
                downloadFile('/inventory/export/excel'+qs,'Inventory.xlsx');
              }}>📊 Export Excel</button>
            <button className="btn btn-primary" style={{fontSize:'13px'}} onClick={()=>{setEditPart(null);setForm(emptyForm);setFormPhoto('');setModal(true);}}>
              + Add Part
            </button>
          </>}
        </div>
      </div>

      {/* Filter bar */}
      <div style={{display:'flex',gap:'10px',marginBottom:'16px',alignItems:'center',flexWrap:'wrap'}}>

        <select className="inp" style={{maxWidth:'180px'}} value={catFilter} onChange={e=>setCatFilter(e.target.value)}>

          {categories.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <label style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',color:'#64748b',cursor:'pointer',whiteSpace:'nowrap'}}>

        </span>}

      </div>

      {/* Table */}
      <div className="card" style={{padding:0}}>

          <div className="ovf"><table>

              {[

            <tbody>{filtered.map(p=>{

              return(

                  <td><span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px'}}>{p.part_code}</span></td>
                  <td>

                    </>}
                  </td>
                </tr>

          </table></div>

          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>

                {formPhoto?(
                  <img src={formPhoto} alt="Part" style={{width:'100%',height:'100%',objectFit:'cover'}}/>

                  <span style={{fontSize:'26px',color:'#cbd5e1'}}>🖼️</span>

              </div>
              <div style={{flex:1}}>
                <label style={{cursor:'pointer'}}>
                  <span className="btn btn-secondary" style={{fontSize:'12px',display:'inline-block'}}>

                <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'4px'}}>Optional — helps technicians identify the part</div>
              </div>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
              <div><label className="lbl">No (Part Code) *</label>
                <input className="inp" disabled={!!editPart} value={form.part_code} onChange={e=>setForm({...form,part_code:e.target.value})}/>
              </div>
              <div><label className="lbl">Category</label>
                <input className="inp" list="cat-options" value={form.category} onChange={e=>setForm({...form,category:e.target.value})} placeholder="Type or select…"/>
                <datalist id="cat-options">{categories.map(c=><option key={c} value={c}/>)}</datalist>
              </div>
            </div>
            <div><label className="lbl">Part Item (Name) *</label>
              <input className="inp" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>
            </div>
            <div><label className="lbl">Description</label>
              <input className="inp" value={form.description} onChange={e=>setForm({...form,description:e.target.value})} placeholder="Spec, model number…"/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
              <div><label className="lbl">Rack No (Location)</label>
                <input className="inp" value={form.location} onChange={e=>setForm({...form,location:e.target.value})} placeholder="e.g. Rack A1"/>
              </div>
              <div><label className="lbl">Use at (Machine)</label>
                <input className="inp" value={form.used_on_asset} onChange={e=>setForm({...form,used_on_asset:e.target.value})} placeholder="e.g. Pump A"/>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:'10px'}}>
              <div><label className="lbl">Quantity</label>
                <input type="number" className="inp" value={form.quantity_on_hand} onChange={e=>setForm({...form,quantity_on_hand:e.target.value})}/>
              </div>
              <div><label className="lbl">Threshold</label>
                <input type="number" className="inp" value={form.reorder_level} onChange={e=>setForm({...form,reorder_level:e.target.value})}/>
              </div>
              <div><label className="lbl">Unit Price (RM)</label>
                <input type="number" step="0.01" className="inp" value={form.unit_cost} onChange={e=>setForm({...form,unit_cost:e.target.value})}/>
              </div>
              <div><label className="lbl">Unit</label>
                <input className="inp" value={form.unit} onChange={e=>setForm({...form,unit:e.target.value})} placeholder="pcs"/>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
              <div><label className="lbl">Supplier</label>
                <input className="inp" value={form.supplier} onChange={e=>setForm({...form,supplier:e.target.value})}/>
              </div>
              <div><label className="lbl">Barcode</label>
                <input className="inp" value={form.barcode} onChange={e=>setForm({...form,barcode:e.target.value})} placeholder="Scan or type"/>
              </div>
            </div>
            <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={save}>Save</button>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>{setModal(false);setEditPart(null);setFormPhoto('');}}>Cancel</button>
            </div>
          </div>
        </Modal>
      )}

      {/* Import result modal */}
      {importModal&&(
        <Modal title="Excel Import Result" onClose={()=>setImportModal(false)}>
          {importing?(
            <div style={{textAlign:'center',padding:'30px'}}>
              <Spinner/>
              <div style={{color:'#64748b',fontSize:'14px',marginTop:'8px'}}>Importing parts…</div>
            </div>
          ):importResult&&(
            <div>
              {importResult.error?(
                <div style={{background:'#fee2e2',color:'#991b1b',padding:'14px',borderRadius:'10px',marginBottom:'12px',fontSize:'13px'}}>
                  ❌ {importResult.error}
                </div>
              ):(
                <div>
                  <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'10px',padding:'16px',marginBottom:'16px'}}>
                    <div style={{fontWeight:700,color:'#16a34a',marginBottom:'10px',fontSize:'15px'}}>✅ Import Complete</div>
                    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'10px'}}>
                      {[
                        {label:'New Parts Added',value:importResult.inserted,color:'#2563eb'},
                        {label:'Parts Updated',  value:importResult.updated,  color:'#d97706'},
                        {label:'Rows Skipped',   value:importResult.skipped,  color:'#dc2626'},
                      ].map((s,i)=>(
                        <div key={i} style={{textAlign:'center',padding:'12px',background:'#fff',borderRadius:'8px',border:'1px solid #e2e8f0'}}>

                  {importResult.skipped_details&&importResult.skipped_details.length>0&&(
                    <div style={{marginBottom:'12px'}}>
                      <div style={{fontWeight:600,fontSize:'13px',color:'#374151',marginBottom:'6px'}}>Skipped rows:</div>
                      <div style={{maxHeight:'120px',overflowY:'auto'}}>
                        {importResult.skipped_details.map((s,i)=>(
                          <div key={i} style={{fontSize:'12px',color:'#dc2626',padding:'4px 8px',background:'#fef2f2',borderRadius:'6px',marginBottom:'3px'}}>

              <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>setImportModal(false)}>Close</button>
            </div>
          )}
        </Modal>
      )}

      {/* ── Photo upload modal — admin/manager only ── */}
      {photoModal&&canManage&&(
        <Modal title={'Photo: '+photoModal.part_code+' — '+photoModal.name} onClose={closePhotoModal}>
          <div style={{display:'flex',flexDirection:'column',gap:'14px',alignItems:'center'}}>
            <div style={{
              width:'100%',aspectRatio:'1',maxWidth:'280px',borderRadius:'12px',overflow:'hidden',
              background:'#f8fafc',border:'2px dashed #e2e8f0',display:'flex',alignItems:'center',justifyContent:'center',
            }}>
              {photoPreview?(
                <img src={photoPreview} alt={photoModal.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              ):(
                <div style={{textAlign:'center',color:'#94a3b8'}}>
                  <div style={{fontSize:'40px',marginBottom:'6px'}}>🖼️</div>

              )}
            </div>

            <label style={{width:'100%',cursor:'pointer'}}>
              <span className="btn btn-secondary" style={{width:'100%',display:'block',textAlign:'center'}}>
                📷 Choose Photo
              </span>
              <input ref={photoFileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhotoSelect}/>

            <div style={{fontSize:'11px',color:'#94a3b8',textAlign:'center'}}>Photos are automatically resized — JPG/PNG recommended.</div>

            <div style={{display:'flex',gap:'10px',width:'100%'}}>

              {photoModal.photo_url&&(

        }}>

            <img src={lightboxPhoto.url} alt={lightboxPhoto.name} style={{maxWidth:'100%',maxHeight:'80vh',borderRadius:'10px',objectFit:'contain'}}/>
