              <div style={{display:'flex',gap:'8px'}}>
                <button className="btn btn-primary" style={{flex:1,padding:'11px'}} onClick={assign} disabled={assigning||!assignTechId}>
                  {assigning?'Assigning…':'✅ Confirm Assignment'}
                </button>
                <button className="btn btn-secondary" style={{flex:1,padding:'11px'}} onClick={()=>setSelected(null)}>Cancel</button>
              </div>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Technician Board ───────────────────────────────────────────────────────
function TechnicianBoard(){
  const [wos,setWos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [completing,setCompleting]=useState(null);
  const [parts,setParts]=useState([]);
  const [partsModal,setPartsModal]=useState(null);
  const [filterStatus,setFilterStatus]=useState('');

  // Completion form state
  const [rootCause,setRootCause]=useState('');
  const [actions,setActions]=useState('');
  const [actualHours,setActualHours]=useState('');
  const [remarks,setRemarks]=useState('');
  const [usedParts,setUsedParts]=useState([]);
  const [compPhotos,setCompPhotos]=useState([]);
  const [submitting,setSubmitting]=useState(false);
  const [autoDowntime,setAutoDowntime]=useState({hours:0,display:'—'});
  const timerRef=useRef(null);

  async function load(){
    try{
      const all=filterStatus
        ?await api('/work-orders/?status='+filterStatus+'&limit=100')
        :[...await api('/work-orders/?status=open&limit=100'),...await api('/work-orders/?status=in_progress&limit=100')];
      setWos(all.sort((a,b)=>{const p={critical:0,high:1,medium:2,low:3};return (p[a.priority]||2)-(p[b.priority]||2);}));
    }catch(e){toast(e.message,'err');}finally{setLoading(false);}
  }
  async function loadParts(woId){try{setParts(await api('/work-orders/'+woId+'/parts-availability'));}catch(e){toast(e.message,'err');}}
  useEffect(()=>{load();},[filterStatus]);
  useWS('work_orders',load);

  // Live downtime timer while completion modal is open
  useEffect(()=>{
    if (!completing) return;
    function tick(){ setAutoDowntime(calcDowntime(completing.created_at, null)); }
    tick();
    timerRef.current = setInterval(tick, 60000);
    return ()=>clearInterval(timerRef.current);
  },[completing]);

  function openComplete(wo){
    setCompleting(wo);
    setRootCause('');setActions('');setActualHours('');setRemarks('');setUsedParts([]);setCompPhotos([]);
    loadParts(wo.id);
  }

  function togglePart(part){
    const exists=usedParts.find(p=>p.spare_part_id===part.id);
    if(exists) setUsedParts(usedParts.filter(p=>p.spare_part_id!==part.id));
    else setUsedParts([...usedParts,{spare_part_id:part.id,quantity_used:1,name:part.name,available:part.quantity_on_hand}]);
  }
  function updateQty(id,qty){setUsedParts(usedParts.map(p=>p.spare_part_id===id?{...p,quantity_used:parseInt(qty)||1}:p));}

  async function submitCompletion(){
    if(!rootCause){toast('Please select a root cause','err');return;}
    if(!actions.trim()){toast('Please describe actions taken','err');return;}
    const hrs = parseFloat(actualHours) || autoDowntime.hours;
    if(!hrs){toast('Please enter actual hours','err');return;}
    for(const p of usedParts){
      if(p.quantity_used>p.available){toast('Insufficient stock for '+p.name,'err');return;}
    }
    setSubmitting(true);
    try{
      // Convert photos
      const photoData=compPhotos.map(p=>({filename:p.file.name,data:p.dataUrl,size:p.file.size}));
      await api('/work-orders/'+completing.id+'/complete',{
        method:'POST',
        body:JSON.stringify({
          root_cause:rootCause,
          actions_taken:actions,
          actual_hours:hrs,
          remarks:remarks||null,
          parts_used:usedParts.map(p=>({spare_part_id:p.spare_part_id,quantity_used:p.quantity_used})),
          completion_photos:photoData,
        })
      });
      toast('Work order completed!');setCompleting(null);load();
    }catch(e){toast(e.message,'err');}finally{setSubmitting(false);}
  }

  async function updateStatus(id,status){try{await api('/work-orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load();}catch(e){toast(e.message,'err');}}

  function extractPhotos(wo){
    const desc=wo.description||'';
    const photos=[];
    const re=/\[PHOTO:([^\|]+)\|([^\]]+)\]/g;
    let m;
    while((m=re.exec(desc))!==null){
      if(m[2]!=='TOO_LARGE') photos.push(m[2]);
    }
    return photos;
  }
  const priorityBorder={critical:'#ef4444',high:'#f97316',medium:'#f59e0b',low:'#3b82f6'};
  const priorityBg={critical:'#fef2f2',high:'#fff7ed',medium:'#fefce8',low:'#f0f9ff'};

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div><h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>Work Order Board</h1><p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>All open work orders — sorted by priority</p></div>
        <span style={{background:'#f0fdf4',color:'#16a34a',border:'1px solid #bbf7d0',padding:'6px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:600}}>● Live</span>
      </div>

      <div style={{display:'flex',gap:'8px',marginBottom:'16px',flexWrap:'wrap'}}>
        {[['','All Open'],['open','Open'],['in_progress','In Progress'],['on_hold','On Hold']].map(([s,l])=>(
          <button key={s} onClick={()=>setFilterStatus(s)} style={{padding:'5px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:600,border:'1px solid',cursor:'pointer',
            borderColor:filterStatus===s?'#2563eb':'#e2e8f0',background:filterStatus===s?'#2563eb':'#fff',color:filterStatus===s?'#fff':'#64748b'}}>
            {l}
          </button>
        ))}
      </div>

      {loading?<Spinner/>:wos.length===0?<Empty msg="No open work orders — great job! 🎉"/>:(
        <div>{wos.map(w=>{
          const photos=extractPhotos(w);
          const dt=calcDowntime(w.created_at,null);
          return (
            <div key={w.id} className="wo-card" style={{borderLeft:'4px solid '+(priorityBorder[w.priority]||'#e2e8f0'),background:priorityBg[w.priority]||'#fff'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'12px'}}>
                <div style={{flex:1}}>
                  <div style={{display:'flex',gap:'6px',alignItems:'center',marginBottom:'8px',flexWrap:'wrap'}}>
                    <span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px',fontWeight:700}}>{w.wo_number}</span>
                    <Badge value={w.priority}/><Badge value={w.status}/>{w.type&&<Badge value={w.type}/>}
                  </div>
                  <div style={{fontWeight:700,color:'#1e293b',fontSize:'15px',marginBottom:'4px'}}>{w.title}</div>
                  <div style={{fontSize:'12px',color:'#64748b',marginBottom:'6px'}}>
                    🏭 {w.asset?.name||'—'} &nbsp;·&nbsp; 📍 {w.asset?.location||'—'}
                  </div>
                  {w.description&&<div style={{fontSize:'12px',color:'#374151',background:'rgba(255,255,255,0.7)',borderRadius:'6px',padding:'8px 10px',marginBottom:'8px',whiteSpace:'pre-line',maxHeight:'80px',overflow:'hidden'}}>{w.description}</div>}

                  {/* Operator photos shown on board */}
                  {photos.length>0&&(
                    <div style={{marginBottom:'8px'}}>
                      <div style={{fontSize:'11px',color:'#64748b',marginBottom:'4px'}}>📷 Operator photos:</div>
                      <PhotoViewer photos={photos}/>
                    </div>
                  )}

                  <div style={{fontSize:'11px',color:'#94a3b8'}}>
                    Created: {fmtDT(w.created_at)}
                    {w.due_date&&<span style={{marginLeft:'12px',color:toUTC(w.due_date)<new Date()?'#dc2626':'#64748b'}}> · Due: {fmtDate(w.due_date)}</span>}
                    <span style={{marginLeft:'12px',color:'#b45309',fontWeight:600}}>⏱ Waiting: {dt.display}</span>
                  </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:'6px',minWidth:'130px'}}>
                  <button className="btn btn-success" style={{fontSize:'12px',padding:'7px 12px'}} onClick={()=>openComplete(w)}>✅ Complete Job</button>
                  <button className="btn btn-secondary" style={{fontSize:'12px',padding:'7px 12px'}} onClick={async()=>{setPartsModal(w);await loadParts(w.id);}}>🔩 Check Parts</button>
                  <select className="inp" style={{fontSize:'12px',padding:'6px 8px'}} value={w.status} onChange={e=>updateStatus(w.id,e.target.value)}>
                    {['open','in_progress','on_hold','cancelled'].map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
                  </select>
                </div>
              </div>
            </div>
          );
        })}</div>
      )}

      {/* Parts availability modal */}
      {partsModal&&(
        <Modal title={'Spare Parts — '+partsModal.asset?.name} onClose={()=>setPartsModal(null)} large>
          <div className="section-title">Parts availability check</div>
          <div style={{maxHeight:'400px',overflowY:'auto'}}>
            {parts.length===0?<Empty msg="No parts in inventory"/>:parts.map(p=>(
              <div key={p.id} className="part-row">
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:'13px',color:'#1e293b'}}>{p.name}</div>
                  <div style={{fontSize:'11px',color:'#64748b'}}>{p.part_code} · {p.location||'—'}</div>
                </div>
                <div style={{textAlign:'right',minWidth:'90px'}}>
                  <div style={{fontWeight:700,color:p.quantity_on_hand===0?'#dc2626':p.is_low_stock?'#ea580c':'#16a34a'}}>{p.quantity_on_hand} {p.unit}</div>
                  <div style={{fontSize:'11px',color:'#94a3b8'}}>Min: {p.reorder_level}</div>
                </div>
                <div style={{width:'60px',textAlign:'center',fontSize:'11px',fontWeight:700,color:p.quantity_on_hand===0?'#dc2626':p.is_low_stock?'#ea580c':'#16a34a'}}>
                  {p.quantity_on_hand===0?'OUT':p.is_low_stock?'LOW':'OK'}
                </div>
              </div>
            ))}
          </div>
        </Modal>
      )}

      {/* Completion form modal */}
      {completing&&(
        <Modal title={'Complete Work Order: '+completing.wo_number} onClose={()=>setCompleting(null)} large>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px'}}>

            {/* Left column */}
            <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
              <div className="section-title">Completion Details</div>

              {/* Auto-calculated downtime display */}
              <div className="dt-box">
                <div className="dt-lbl">⏱ Auto-calculated downtime (from request time)</div>
                <div className="dt-val">{autoDowntime.display}</div>
                <div style={{fontSize:'11px',color:'#92400e',marginTop:'4px'}}>Request time: {fmtDT(completing.created_at)}</div>
              </div>

              <div>
                <label className="lbl">Actual Downtime Hours <span style={{color:'#ef4444'}}>*</span></label>
                <input type="number" step="0.5" min="0.5" className="inp"
                  placeholder={'Auto: '+autoDowntime.hours+' hrs — override if needed'}
                  value={actualHours} onChange={e=>setActualHours(e.target.value)}/>
                <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'4px'}}>Leave blank to use auto-calculated value ({autoDowntime.hours}h)</div>
              </div>

              <div>
                <label className="lbl">Root Cause <span style={{color:'#ef4444'}}>*</span></label>
                <select className="inp" value={rootCause} onChange={e=>setRootCause(e.target.value)}>
                  <option value="">Select root cause…</option>
                  {ROOT_CAUSES.map(rc=><option key={rc} value={rc}>{rc}</option>)}
                </select>
              </div>

              <div>
                <label className="lbl">Actions Taken <span style={{color:'#ef4444'}}>*</span></label>
                <textarea className="inp" rows={4} placeholder="Describe what was done to fix the issue…" value={actions} onChange={e=>setActions(e.target.value)}/>
              </div>

              <div>
                <label className="lbl">Remarks <span style={{fontSize:'11px',fontWeight:400,color:'#94a3b8'}}>(optional)</span></label>
                <textarea className="inp" rows={2} placeholder="Any additional notes…" value={remarks} onChange={e=>setRemarks(e.target.value)}/>
              </div>

              <div>
                <label className="lbl">Completion Photos <span style={{fontSize:'11px',fontWeight:400,color:'#94a3b8'}}>(optional, max 3)</span></label>
                <PhotoUploader photos={compPhotos} setPhotos={setCompPhotos} maxPhotos={3}/>
              </div>
            </div>

            {/* Right column — parts */}
            <div>
              <div className="section-title">Parts Used</div>
              <div style={{fontSize:'12px',color:'#64748b',marginBottom:'10px'}}>Tick each part used. Stock will be auto-deducted.</div>
              <div style={{maxHeight:'360px',overflowY:'auto',border:'1px solid #f1f5f9',borderRadius:'8px',padding:'8px'}}>
                {parts.length===0?<Empty msg="No parts in inventory"/>:parts.map(p=>{
                  const used=usedParts.find(x=>x.spare_part_id===p.id);
                  return (
                    <div key={p.id} style={{display:'flex',alignItems:'center',gap:'8px',padding:'6px 0',borderBottom:'1px solid #f8fafc'}}>
                      <input type="checkbox" checked={!!used} onChange={()=>togglePart(p)} style={{width:'16px',height:'16px',cursor:'pointer'}}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:'13px',fontWeight:600,color:'#1e293b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                        <div style={{fontSize:'11px',color:p.quantity_on_hand===0?'#dc2626':p.is_low_stock?'#ea580c':'#64748b'}}>
                          Stock: {p.quantity_on_hand} {p.unit}
                        </div>
                      </div>
                      {used&&<input type="number" min={1} max={p.quantity_on_hand} value={used.quantity_used}
                        onChange={e=>updateQty(p.id,e.target.value)}
                        style={{width:'56px',border:'1px solid #e2e8f0',borderRadius:'6px',padding:'4px 6px',fontSize:'13px',textAlign:'center'}}/>}
                    </div>
                  );
                })}
              </div>
              {usedParts.length>0&&<div style={{marginTop:'8px',padding:'8px 12px',background:'#f0fdf4',borderRadius:'8px',fontSize:'12px',color:'#166534'}}>
                ✅ {usedParts.length} part{usedParts.length>1?'s':''} selected
              </div>}

              {/* Show operator photos for reference */}
              {extractPhotos(completing).length>0&&<div style={{marginTop:'16px'}}>
                <div className="section-title">Operator Photos (reference)</div>
                <PhotoViewer photos={extractPhotos(completing)}/>
              </div>}
            </div>
          </div>

          <div style={{display:'flex',gap:'10px',marginTop:'20px',borderTop:'1px solid #f1f5f9',paddingTop:'16px'}}>
            <button className="btn btn-primary" style={{flex:1,padding:'12px'}} onClick={submitCompletion} disabled={submitting}>
              {submitting?'Submitting…':'✅ Submit Completion Report'}
            </button>
            <button className="btn btn-secondary" style={{flex:1,padding:'12px'}} onClick={()=>setCompleting(null)}>Cancel</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── History Log ────────────────────────────────────────────────────────────
function HistoryLog(){
  const [wos,setWos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [statusFilter,setStatusFilter]=useState('completed');
  const [selected,setSelected]=useState(null);
  const [dateFrom,setDateFrom]=useState('');
  const [dateTo,setDateTo]=useState('');

  async function load(){
    setLoading(true);
    try{
      let url='/work-orders/?limit=300';
      if(statusFilter) url+='&status='+statusFilter;
      const data=await api(url);
      setWos(data.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)));
    }catch(e){toast(e.message,'err');}finally{setLoading(false);}
  }
  useEffect(()=>{load();},[statusFilter]);

  // Extract all embedded base64 photos from description
  // Handles both [OPERATOR_PHOTOS] and [COMPLETION_PHOTOS] sections
  function extractPhotos(wo, key){
    const desc=wo.description||'';
    const photos=[];
    const re=/\[PHOTO:([^\|]+)\|([^\]]+)\]/g;
    let m;
    while((m=re.exec(desc))!==null){
      if(m[2]!=='TOO_LARGE') photos.push(m[2]);
    }
    return photos;
  }

  const allPhotos = wo => extractPhotos(wo, 'all');

  const filtered = wos.filter(w=>{
    const s=search.toLowerCase();
    const matchText = !s || w.wo_number.toLowerCase().includes(s) || w.title.toLowerCase().includes(s) || (w.asset?.name||'').toLowerCase().includes(s) || (w.description||'').toLowerCase().includes(s);
    const matchFrom = !dateFrom || toUTC(w.created_at) >= new Date(dateFrom);
    const matchTo   = !dateTo   || toUTC(w.created_at) <= new Date(dateTo+'T23:59:59');
    return matchText && matchFrom && matchTo;
  });

  function parseField(desc, field){
    for(const line of (desc||'').split('\n')){
      if(line.trim().startsWith(field)){
        const parts=line.split(':',2);
        if(parts[1]) return parts[1].trim();
      }
    }
    return '—';
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div><h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>History Log</h1><p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>Complete record of all work orders</p></div>
      </div>

      {/* Filters */}
      <div style={{background:'#fff',borderRadius:'12px',padding:'16px',border:'1px solid #f1f5f9',marginBottom:'16px',display:'flex',gap:'12px',flexWrap:'wrap',alignItems:'flex-end'}}>
        <div style={{flex:'1',minWidth:'160px'}}>
          <label className="lbl">Search</label>
          <input className="inp" placeholder="WO#, machine, description…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <div style={{minWidth:'130px'}}>
          <label className="lbl">Status</label>
          <select className="inp" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="">All statuses</option>
            <option value="completed">Completed</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div style={{minWidth:'130px'}}>
          <label className="lbl">From Date</label>
          <input type="date" className="inp" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/>
        </div>
        <div style={{minWidth:'130px'}}>
          <label className="lbl">To Date</label>
          <input type="date" className="inp" value={dateTo} onChange={e=>setDateTo(e.target.value)}/>
        </div>
        <button className="btn btn-primary" onClick={load}>🔄 Refresh</button>
      </div>

      <div style={{fontSize:'12px',color:'#94a3b8',marginBottom:'10px'}}>{filtered.length} records found</div>

      {loading?<Spinner/>:filtered.length===0?<Empty msg="No records found"/>:(
        <div className="card" style={{padding:0}}>
          <div className="ovf"><table>
            <thead><tr>
              {['WO #','Machine','Category / Title','Operator','Status','Root Cause','Downtime','Request Date','Completed','Photos','Details'].map(h=><th key={h}>{h}</th>)}
            </tr></thead>
            <tbody>{filtered.map(w=>{
              const isReq=w.title.startsWith('[Request]');
              const operator=parseField(w.description,'Submitted by');
              const category=parseField(w.description,'Category');
              const rootCause=parseField(w.description,'Root cause');
              const actualHrs=w.actual_hours?w.actual_hours+'h':calcDowntime(w.created_at,w.completed_at).display;
              const photos=allPhotos(w);
              return (
                <tr key={w.id} className={w.status==='completed'?'history-row-completed':w.status==='open'?'history-row-open':''}>
                  <td><span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px',fontWeight:700}}>{w.wo_number}</span></td>
                  <td style={{fontWeight:600,whiteSpace:'nowrap'}}>{w.asset?.name||'—'}</td>
                  <td style={{maxWidth:'180px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={w.title}>{isReq?(category||'—'):w.title}</td>
                  <td style={{color:'#64748b',fontSize:'12px'}}>{operator||'—'}</td>
                  <td><Badge value={w.status}/></td>
                  <td style={{color:'#64748b',fontSize:'12px',maxWidth:'120px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={rootCause}>{rootCause}</td>
                  <td style={{fontWeight:600,color:'#b45309'}}>{actualHrs}</td>
                  <td style={{color:'#64748b',fontSize:'12px',whiteSpace:'nowrap'}}>{fmtDate(w.created_at)}</td>
                  <td style={{color:'#64748b',fontSize:'12px',whiteSpace:'nowrap'}}>{w.completed_at?fmtDate(w.completed_at):'—'}</td>
                  <td>
                    {photos.length>0
                      ?<button className="btn btn-secondary" style={{fontSize:'11px',padding:'3px 8px'}} onClick={()=>setSelected({...w,_photos:photos})}>📷 {photos.length}</button>
                      :<span style={{color:'#cbd5e1',fontSize:'12px'}}>—</span>}
                  </td>
                  <td>
                    <button className="btn btn-secondary" style={{fontSize:'11px',padding:'3px 8px'}} onClick={()=>setSelected({...w,_photos:photos})}>View</button>
                  </td>
                </tr>
              );
            })}</tbody>
          </table></div>
        </div>
      )}

      {/* Detail modal */}
      {selected&&(
        <Modal title={selected.wo_number+' — '+( selected.asset?.name||'—')} onClose={()=>setSelected(null)} large>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px'}}>
            <div>
              <div className="section-title">Work Order Details</div>
              <div style={{background:'#f8fafc',borderRadius:'10px',padding:'14px',fontSize:'13px',lineHeight:1.8,marginBottom:'12px'}}>
                <div><strong>WO Number:</strong> {selected.wo_number}</div>
                <div><strong>Machine:</strong> {selected.asset?.name||'—'} ({selected.asset?.asset_code||'—'})</div>
                <div><strong>Status:</strong> <Badge value={selected.status}/></div>
                <div><strong>Priority:</strong> <Badge value={selected.priority}/></div>
                <div><strong>Type:</strong> <Badge value={selected.type}/></div>
                <div><strong>Request Date:</strong> {fmtDT(selected.created_at)}</div>
                <div><strong>Completed:</strong> {selected.completed_at?fmtDT(selected.completed_at):'Not completed'}</div>
                <div><strong>Actual Hours:</strong> {selected.actual_hours?selected.actual_hours+'h':calcDowntime(selected.created_at,selected.completed_at).display}</div>
              </div>
              <div className="section-title">Full Description</div>
              <div style={{background:'#f8fafc',borderRadius:'10px',padding:'14px',fontSize:'13px',color:'#374151',whiteSpace:'pre-line',lineHeight:1.7}}>
                {selected.description||'No description'}
              </div>
            </div>
            <div>
              <div className="section-title">Photos</div>
              {selected._photos&&selected._photos.length>0
                ?<PhotoViewer photos={selected._photos}/>
                :<Empty msg="No photos attached"/>}
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Assets ─────────────────────────────────────────────────────────────────
function Assets(){
  const [assets,setAssets]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [modal,setModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [importModal,setImportModal]=useState(false);
  const [importResult,setImportResult]=useState(null);
  const [importing,setImporting]=useState(false);
  const importFileRef=useRef(null);
  const emptyForm={asset_code:'',name:'',category:'',location:'',manufacturer:'',model:'',serial_number:'',status:'operational',notes:''};
  const [form,setForm]=useState(emptyForm);
  const CATS=['Pump','Motor','Compressor','Conveyor','HVAC','Generator','Other'];
  const STATS=['operational','under_maintenance','out_of_service','decommissioned'];

  async function load(){try{setAssets(await api('/assets/'));}catch(e){toast(e.message,'err');}finally{setLoading(false);}}
  useEffect(()=>{load();},[]);
  useWS('assets',load);

  async function save(){
    try{
      if(editing) await api('/assets/'+editing.id,{method:'PATCH',body:JSON.stringify(form)});
      else await api('/assets/',{method:'POST',body:JSON.stringify(form)});
      toast(editing?'Asset updated':'Asset created');setModal(false);setEditing(null);load();
    }catch(e){toast(e.message,'err');}
  }

  async function decommission(id,name){
    if(!confirm('Mark "'+name+'" as decommissioned?\nThis preserves all work order history.')) return;
    try{
      await api('/assets/'+id,{method:'PATCH',body:JSON.stringify({status:'decommissioned'})});
      toast('Asset marked as decommissioned');load();
    }catch(e){toast(e.message,'err');}
  }

  async function hardDel(id,name){
    if(!confirm('PERMANENTLY DELETE "'+name+'"?\n\nThis will fail if work orders are linked.\nUse Decommission to preserve history.')) return;
    try{
      await api('/assets/'+id,{method:'DELETE'});
      toast('Asset deleted');load();
    }catch(e){
      toast('Cannot delete — asset has linked work orders. Use Decommission instead.','err');
    }
  }

  // ── Excel import ────────────────────────────────────────────────────────
  async function handleImport(e){
    const file = e.target.files[0];
    if (!file) return;
    if (!file.name.endsWith('.xlsx')){toast('Please select an .xlsx file','err');return;}
    setImporting(true);
    setImportResult(null);
    setImportModal(true);
    try{
      // File uploads need multipart/form-data — use FormData, NOT the api() helper
      const token = localStorage.getItem('cmms_token');
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch(window.API_BASE+'/data/import/assets', {
        method:'POST',
        headers:{ Authorization:'Bearer '+token },
        // DO NOT set Content-Type — browser sets it automatically with boundary
        body: formData,
      });
      if (!res.ok){
        const err = await res.json().catch(()=>({}));
        throw new Error(err.detail||'Import failed');
      }
      const result = await res.json();
      setImportResult(result);
      load();
    }catch(ex){
      setImportResult({error:ex.message});
    }finally{
      setImporting(false);
      e.target.value=''; // reset file input
    }
  }

  const filtered=assets.filter(a=>
    a.name.toLowerCase().includes(search.toLowerCase())||
    a.asset_code.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      {/* Header */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div>
          <h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>Assets</h1>
          <p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>Machines and equipment</p>
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          {/* Download template */}
          <a href="/data/import/template" download="CMMS_Asset_Import_Template.xlsx">
            <button className="btn btn-secondary" style={{fontSize:'13px'}}>📥 Download Template</button>
          </a>
          {/* Import from Excel */}
          <label style={{cursor:'pointer'}}>
            <span className="btn btn-secondary" style={{fontSize:'13px',display:'inline-block'}}>
              {importing ? '⏳ Importing…' : '📤 Import Excel'}
            </span>
            <input
              ref={importFileRef}
              type="file"
              accept=".xlsx"
              style={{display:'none'}}
              onChange={handleImport}
              disabled={importing}
            />
          </label>
          <button className="btn btn-primary" style={{fontSize:'13px'}} onClick={()=>{setEditing(null);setForm(emptyForm);setModal(true);}}>
            + Add Asset
          </button>
        </div>
      </div>

      <input className="inp" style={{maxWidth:'280px',marginBottom:'16px'}} placeholder="Search assets…" value={search} onChange={e=>setSearch(e.target.value)}/>

      <div className="card" style={{padding:0}}>
        {loading?<Spinner/>:filtered.length===0?<Empty msg="No assets found"/>:(
          <div className="ovf"><table>
            <thead><tr>{['Code','Name','Category','Location','Status','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{filtered.map(a=>(
              <tr key={a.id}>
                <td><span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px'}}>{a.asset_code}</span></td>
                <td style={{fontWeight:600}}>{a.name}</td>
                <td style={{color:'#64748b'}}>{a.category}</td>
                <td style={{color:'#64748b'}}>{a.location}</td>
                <td><Badge value={a.status}/></td>
                <td style={{whiteSpace:'nowrap'}}>
                  <button onClick={()=>{setEditing(a);setForm({...emptyForm,...a});setModal(true);}}
                    style={{color:'#2563eb',background:'none',border:'none',cursor:'pointer',fontSize:'12px',marginRight:'8px'}}>Edit</button>
                  <button onClick={()=>decommission(a.id,a.name)}
                    style={{color:'#d97706',background:'none',border:'none',cursor:'pointer',fontSize:'12px',marginRight:'8px'}}>Decommission</button>
                  <button onClick={()=>hardDel(a.id,a.name)}
                    style={{color:'#dc2626',background:'none',border:'none',cursor:'pointer',fontSize:'12px'}}>Delete</button>
                </td>
              </tr>
            ))}</tbody>
          </table></div>
        )}
      </div>

      {/* Add/Edit modal */}
      {modal&&(
        <Modal title={editing?'Edit Asset':'Add Asset'} onClose={()=>setModal(false)}>
          <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
            {[['asset_code','Asset Code *',!!editing],['name','Name *'],['location','Location *'],['manufacturer','Manufacturer'],['model','Model'],['serial_number','Serial Number']].map(([k,lbl,dis])=>(
              <div key={k}><label className="lbl">{lbl}</label>
                <input className="inp" disabled={!!dis} value={form[k]||''} onChange={e=>setForm({...form,[k]:e.target.value})}/>
              </div>
            ))}
            <div><label className="lbl">Category</label>
              <select className="inp" value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
                <option value="">Select…</option>{CATS.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div><label className="lbl">Status</label>
              <select className="inp" value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
                {STATS.map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
              </select>
            </div>
            <div><label className="lbl">Notes</label>
              <textarea className="inp" rows={3} value={form.notes||''} onChange={e=>setForm({...form,notes:e.target.value})}/>
            </div>
            <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
              <button className="btn btn-primary" style={{flex:1}} onClick={save}>Save</button>
              <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setModal(false)}>Cancel</button>
            </div>
          </div>
        </Modal>
      )}

      {/* Import result modal */}
      {importModal&&(
        <Modal title="Excel Import Result" onClose={()=>setImportModal(false)}>
          {importing?(
            <div style={{textAlign:'center',padding:'30px'}}>
              <Spinner/>
              <div style={{color:'#64748b',fontSize:'14px',marginTop:'8px'}}>Importing assets…</div>
            </div>
          ):importResult&&(
            <div>
              {importResult.error?(
                <div style={{background:'#fee2e2',color:'#991b1b',padding:'14px',borderRadius:'10px',marginBottom:'12px'}}>
                  ❌ {importResult.error}
                </div>
              ):(
                <div>
                  <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'10px',padding:'16px',marginBottom:'16px'}}>
                    <div style={{fontWeight:700,color:'#16a34a',marginBottom:'8px'}}>✅ Import Complete</div>
                    <div style={{fontSize:'14px',color:'#374151',lineHeight:2}}>
                      <div>📥 <strong>{importResult.inserted}</strong> new assets inserted</div>
                      <div>✏️ <strong>{importResult.updated}</strong> existing assets updated</div>
                      <div>⏭️ <strong>{importResult.skipped}</strong> rows skipped</div>
                    </div>
                  </div>
                  {importResult.skipped_details&&importResult.skipped_details.length>0&&(
                    <div>
                      <div style={{fontWeight:600,color:'#374151',marginBottom:'8px',fontSize:'13px'}}>Skipped rows:</div>
                      {importResult.skipped_details.map((s,i)=>(
                        <div key={i} style={{fontSize:'12px',color:'#dc2626',padding:'4px 8px',background:'#fef2f2',borderRadius:'6px',marginBottom:'4px'}}>
                          Row {s.row}: {s.reason}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
              <button className="btn btn-primary" style={{width:'100%',marginTop:'12px'}} onClick={()=>setImportModal(false)}>Close</button>
            </div>
          )}
        </Modal>
      )}
    </div>
  );
}

// ── Inventory ──────────────────────────────────────────────────────────────
function Inventory(){
  const [parts,setParts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [lowOnly,setLowOnly]=useState(false);
  const [modal,setModal]=useState(false);
  const [restockId,setRestockId]=useState(null);
  const [restockQty,setRestockQty]=useState(1);
  const emptyForm={part_code:'',name:'',category:'',unit:'pcs',quantity_on_hand:0,reorder_level:5,unit_cost:'',supplier:'',location:''};
  const [form,setForm]=useState(emptyForm);
  async function load(){try{setParts(await api('/inventory/?low_stock='+lowOnly));}catch(e){toast(e.message,'err');}finally{setLoading(false);}}
  useEffect(()=>{load();},[lowOnly]);useWS('inventory',load);
  async function save(){
    try{
      const p={...form,quantity_on_hand:parseInt(form.quantity_on_hand),reorder_level:parseInt(form.reorder_level)};
      if(p.unit_cost) p.unit_cost=parseFloat(p.unit_cost);
      await api('/inventory/',{method:'POST',body:JSON.stringify(p)});
      toast('Part added');setModal(false);setForm(emptyForm);load();
    }catch(e){toast(e.message,'err');}
  }
  async function restock(){try{await api('/inventory/'+restockId+'/restock?quantity='+restockQty,{method:'POST'});toast('Restocked!');setRestockId(null);load();}catch(e){toast(e.message,'err');}}
  async function del(id){if(!confirm('Delete?'))return;try{await api('/inventory/'+id,{method:'DELETE'});toast('Deleted');load();}catch(e){toast(e.message,'err');}}
  const filtered=parts.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.part_code.toLowerCase().includes(search.toLowerCase()));
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div><h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>Inventory</h1><p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>Spare parts management</p></div>
        <button className="btn btn-primary" onClick={()=>setModal(true)}>+ Add Part</button>
      </div>
      <div style={{display:'flex',gap:'12px',marginBottom:'16px',alignItems:'center'}}>
        <input className="inp" style={{maxWidth:'260px'}} placeholder="Search parts…" value={search} onChange={e=>setSearch(e.target.value)}/>
        <label style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',color:'#64748b',cursor:'pointer'}}><input type="checkbox" checked={lowOnly} onChange={e=>setLowOnly(e.target.checked)}/> Low stock only</label>
      </div>
      <div className="card" style={{padding:0}}>
        {loading?<Spinner/>:filtered.length===0?<Empty msg="No parts found"/>:(
          <div className="ovf"><table>
            <thead><tr>{['Part Code','Name','Category','In Stock','Reorder Lvl','Unit Cost','Supplier','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{filtered.map(p=>{
              const isLow=p.quantity_on_hand<=p.reorder_level;
              return(<tr key={p.id} style={isLow?{background:'#fff7ed'}:{}}>
                <td><span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px'}}>{p.part_code}</span></td>
                <td style={{fontWeight:600}}>{p.name}{isLow&&' ⚠️'}</td>
                <td style={{color:'#64748b'}}>{p.category||'—'}</td>
                <td style={{fontWeight:700,color:isLow?'#ea580c':'#1e293b'}}>{p.quantity_on_hand} {p.unit}</td>
                <td style={{color:'#64748b'}}>{p.reorder_level}</td>
                <td style={{color:'#64748b'}}>{p.unit_cost?'RM '+p.unit_cost.toFixed(2):'—'}</td>
                <td style={{color:'#64748b'}}>{p.supplier||'—'}</td>
                <td>
                  <button onClick={()=>{setRestockId(p.id);setRestockQty(1);}} style={{color:'#16a34a',background:'none',border:'none',cursor:'pointer',fontSize:'13px',marginRight:'10px'}}>Restock</button>
                  <button onClick={()=>del(p.id)} style={{color:'#dc2626',background:'none',border:'none',cursor:'pointer',fontSize:'13px'}}>Delete</button>
                </td>
              </tr>);
            })}</tbody>
          </table></div>
        )}
      </div>
      {modal&&(<Modal title="Add Spare Part" onClose={()=>setModal(false)}>
        <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
          {[['part_code','Part Code *'],['name','Name *'],['category','Category'],['supplier','Supplier'],['location','Storage Location']].map(([k,lbl])=>(
            <div key={k}><label className="lbl">{lbl}</label><input className="inp" value={form[k]||''} onChange={e=>setForm({...form,[k]:e.target.value})}/></div>
          ))}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'10px'}}>
            <div><label className="lbl">Qty</label><input type="number" className="inp" value={form.quantity_on_hand} onChange={e=>setForm({...form,quantity_on_hand:e.target.value})}/></div>
            <div><label className="lbl">Reorder Lvl</label><input type="number" className="inp" value={form.reorder_level} onChange={e=>setForm({...form,reorder_level:e.target.value})}/></div>
            <div><label className="lbl">Cost (RM)</label><input type="number" className="inp" value={form.unit_cost} onChange={e=>setForm({...form,unit_cost:e.target.value})}/></div>
          </div>
          <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
            <button className="btn btn-primary" style={{flex:1}} onClick={save}>Save</button>
            <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setModal(false)}>Cancel</button>
          </div>
        </div>
      </Modal>)}
      {restockId&&(<Modal title="Restock Part" onClose={()=>setRestockId(null)}>
        <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
          <div><label className="lbl">Quantity to Add</label><input type="number" className="inp" min={1} value={restockQty} onChange={e=>setRestockQty(+e.target.value)}/></div>
          <div style={{display:'flex',gap:'10px'}}>
            <button className="btn btn-primary" style={{flex:1}} onClick={restock} disabled={restockQty<1}>Confirm Restock</button>
            <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setRestockId(null)}>Cancel</button>
          </div>
        </div>
      </Modal>)}
    </div>
  );
}

// ── PM Schedules ───────────────────────────────────────────────────────────
function PMSchedules(){
  const [schedules,setSchedules]=useState([]);
  const [assets,setAssets]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const emptyForm={asset_id:'',title:'',description:'',frequency:'monthly',interval_days:30,estimated_hours:'',next_due:''};
  const [form,setForm]=useState(emptyForm);
  const FREQS=['daily','weekly','monthly','quarterly','biannual','annual','custom'];
  async function load(){try{const [s,a]=await Promise.all([api('/pm-schedules/'),api('/assets/')]);setSchedules(s);setAssets(a);}catch(e){toast(e.message,'err');}finally{setLoading(false);}}
  useEffect(()=>{load();},[]);
  async function create(){
    try{
      const p={...form,interval_days:parseInt(form.interval_days)};
      if(p.next_due) p.next_due=new Date(p.next_due).toISOString();
      if(p.estimated_hours) p.estimated_hours=parseFloat(p.estimated_hours);
      await api('/pm-schedules/',{method:'POST',body:JSON.stringify(p)});
      toast('Created');setModal(false);setForm(emptyForm);load();
    }catch(e){toast(e.message,'err');}
  }
  async function trigger(id){try{await api('/pm-schedules/'+id+'/trigger',{method:'POST'});toast('WO generated!');load();}catch(e){toast(e.message,'err');}}
  async function toggle(pm){try{await api('/pm-schedules/'+pm.id,{method:'PATCH',body:JSON.stringify({is_active:!pm.is_active})});load();}catch(e){toast(e.message,'err');}}
  function fmtDate(d){return d?new Date(d).toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'}):'—';}
  function isOD(d){return d&&toUTC(d)<new Date();}
  function isSoon(d){if(!d)return false;const diff=(toUTC(d)-new Date())/(1000*60*60*24);return diff>=0&&diff<=7;}
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div><h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>PM Schedules</h1><p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>Preventive maintenance planning</p></div>
        <button className="btn btn-primary" onClick={()=>setModal(true)}>+ New Schedule</button>
      </div>
      <div className="card" style={{padding:0}}>
        {loading?<Spinner/>:schedules.length===0?<Empty msg="No PM schedules"/>:(
          <div className="ovf"><table>
            <thead><tr>{['Title','Asset','Frequency','Next Due','Est. Hours','Status','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{schedules.map(pm=>{
              const ov=isOD(pm.next_due),soon=isSoon(pm.next_due);
              return(<tr key={pm.id} style={ov?{background:'#fef2f2',borderLeft:'3px solid #ef4444'}:soon?{background:'#fefce8',borderLeft:'3px solid #f59e0b'}:{}}>
                <td style={{fontWeight:600}}>{pm.title}</td>
                <td style={{color:'#64748b',fontSize:'12px'}}>{pm.asset?.name||'—'}</td>
                <td style={{color:'#64748b',textTransform:'capitalize'}}>{pm.frequency}</td>
                <td style={{fontWeight:600,color:ov?'#dc2626':soon?'#d97706':'#1e293b'}}>{fmtDate(pm.next_due)}{ov&&' ⚠️'}</td>
                <td style={{color:'#64748b'}}>{pm.estimated_hours?pm.estimated_hours+'h':'—'}</td>
                <td><Badge value={pm.is_active?'active':'inactive'}/></td>
                <td>
                  <button onClick={()=>trigger(pm.id)} style={{color:'#7c3aed',background:'none',border:'none',cursor:'pointer',fontSize:'13px',marginRight:'10px'}}>⚡ Trigger</button>
                  <button onClick={()=>toggle(pm)} style={{color:'#64748b',background:'none',border:'none',cursor:'pointer',fontSize:'13px'}}>{pm.is_active?'Deactivate':'Activate'}</button>
                </td>
              </tr>);
            })}</tbody>
          </table></div>
        )}
      </div>
      {modal&&(<Modal title="New PM Schedule" onClose={()=>setModal(false)}>
        <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
          <div><label className="lbl">Asset *</label><select className="inp" value={form.asset_id} onChange={e=>setForm({...form,asset_id:e.target.value})}><option value="">Select asset…</option>{assets.map(a=><option key={a.id} value={a.id}>{a.name} ({a.asset_code})</option>)}</select></div>
          <div><label className="lbl">Title *</label><input className="inp" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></div>
          <div><label className="lbl">Description</label><textarea className="inp" rows={2} value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
            <div><label className="lbl">Frequency</label><select className="inp" value={form.frequency} onChange={e=>setForm({...form,frequency:e.target.value})}>{FREQS.map(f=><option key={f} value={f}>{f}</option>)}</select></div>
            <div><label className="lbl">Interval (days)</label><input type="number" className="inp" value={form.interval_days} onChange={e=>setForm({...form,interval_days:e.target.value})}/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
            <div><label className="lbl">First Due Date *</label><input type="datetime-local" className="inp" value={form.next_due} onChange={e=>setForm({...form,next_due:e.target.value})}/></div>
            <div><label className="lbl">Est. Hours</label><input type="number" className="inp" value={form.estimated_hours} onChange={e=>setForm({...form,estimated_hours:e.target.value})}/></div>
          </div>
          <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
            <button className="btn btn-primary" style={{flex:1}} onClick={create}>Create Schedule</button>
            <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setModal(false)}>Cancel</button>
          </div>
        </div>
      </Modal>)}
    </div>
  );
}

// ── App Shell ──────────────────────────────────────────────────────────────
const NAV=[
  {key:'dashboard', label:'Dashboard',    icon:'📊'},
  {key:'inbox',     label:'Admin Inbox',  icon:'📥'},
  {key:'board',     label:'Work Orders',  icon:'📋'},
  {key:'history',   label:'History Log',  icon:'🗂️'},
  {key:'qr',        label:'QR Code',      icon:'🔲'},
  {key:'assets',    label:'Assets',       icon:'🏭'},
  {key:'inventory', label:'Inventory',    icon:'📦'},
  {key:'pm',        label:'PM Schedules', icon:'📅'},
];

function App(){
  const [user,setUser]=useState(null);
  const [page,setPage]=useState('dashboard');
  useEffect(()=>{
    const token=localStorage.getItem('cmms_token');
    if(token) api('/auth/me').then(setUser).catch(()=>localStorage.removeItem('cmms_token'));
  },[]);
  if(!user) return <Login onLogin={setUser}/>;
  const pages={dashboard:Dashboard,inbox:AdminInbox,board:TechnicianBoard,history:HistoryLog,qr:QRPage,assets:Assets,inventory:Inventory,pm:PMSchedules};
  const PageComp=pages[page]||Dashboard;
  return (
    <div>
      <div className="sidebar">
        <div style={{padding:'20px 16px',borderBottom:'1px solid #334155'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
            <div style={{width:'36px',height:'36px',background:'#2563eb',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px'}}>🔧</div>
            <div><div style={{color:'#fff',fontWeight:800,fontSize:'14px'}}>CMMS Pro</div><div style={{color:'#64748b',fontSize:'11px'}}>Maintenance System</div></div>
          </div>
        </div>
        <nav style={{flex:1,padding:'12px 8px'}}>
          {NAV.map(n=>(
            <div key={n.key} className={'nav-link'+(page===n.key?' active':'')} onClick={()=>setPage(n.key)}>
              <span>{n.icon}</span><span>{n.label}</span>
            </div>
          ))}
        </nav>
        <div style={{padding:'16px',borderTop:'1px solid #334155'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}}>
            <div style={{width:'32px',height:'32px',background:'#2563eb',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:'13px'}}>
              {user.name?user.name.charAt(0).toUpperCase():'U'}
            </div>
            <div><div style={{color:'#fff',fontSize:'12px',fontWeight:600}}>{user.name}</div><div style={{color:'#64748b',fontSize:'11px',textTransform:'capitalize'}}>{user.role}</div></div>
          </div>
          <button onClick={()=>{localStorage.removeItem('cmms_token');setUser(null);}} style={{width:'100%',background:'none',border:'1px solid #334155',color:'#94a3b8',padding:'7px',borderRadius:'8px',cursor:'pointer',fontSize:'12px'}}>Sign out</button>
        </div>
      </div>
      <div className="main-content"><PageComp/></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
