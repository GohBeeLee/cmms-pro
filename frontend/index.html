<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const ROOT_CAUSE_GROUPS = {
  "Mechanical": [
    "Bearing","Chain","Belt","Fastener","Wear Parts",
    "Universal Joint","Pneumatic","Alignment","Cutter Adjustment",
  ],
  "Electrical": [
    "Motor","Sensor","PLC","Power Trip","Controller",
    "Control Panel","Wiring","Interference Signal",
  ],
  "Others": [
    "CV Files","Setting","Hardware","Glue Pot","Software Bug",
    "Operator Mistake","Material",
  ],
};
// Flat list kept for any code that still expects a plain array (e.g. validation)
const ROOT_CAUSES = Object.values(ROOT_CAUSE_GROUPS).flat();

// ── Helpers ────────────────────────────────────────────────────────────────
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast t-' + (type||'ok');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

// ── Auth context ───────────────────────────────────────────────────────────
const AuthCtx = React.createContext(null);
function useAuth(){ return React.useContext(AuthCtx); }

async function api(path, opts) {
  opts = opts||{};
  const token = localStorage.getItem('cmms_token');
  const headers = Object.assign({'Content-Type':'application/json'}, token?{Authorization:'Bearer '+token}:{}, opts.headers||{});
  const res = await fetch(window.API_BASE+path, Object.assign({},opts,{headers}));
  if (res.status===401){localStorage.removeItem('cmms_token');location.reload();}
  if (!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||'Request failed');}
  if (res.status===204) return null;
  return res.json();
}

// ── Authenticated file download ────────────────────────────────────────────
// Fetches a file with the JWT token in the header, then triggers browser download.
// Use this instead of <a href> for any protected endpoint.
async function downloadFile(path, filename) {
  try {
    const token = localStorage.getItem('cmms_token');
    const res = await fetch(window.API_BASE + path, {
      method: 'GET',
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.status === 401) { localStorage.removeItem('cmms_token'); location.reload(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || 'Download failed');
    }
    // Get filename from Content-Disposition header if available
    const cd = res.headers.get('Content-Disposition') || '';
    const match = cd.match(/filename="?([^";\n]+)"?/);
    const fname = match ? match[1] : filename;
    // Create blob and trigger download
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    // Show error toast
    const el = document.createElement('div');
    el.className = 'toast t-err';
    el.textContent = '❌ ' + e.message;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

  out_of_service:'#fee2e2;#991b1b',decommissioned:'#f1f5f9;#475569',

  medium:'#fef9c3;#854d0e',high:'#ffedd5;#9a3412',

function Spinner(){return <div className="spinner"></div>;}
function Empty({msg}){return <div style={{textAlign:'center',padding:'40px',color:'#94a3b8',fontSize:'14px'}}>{msg}</div>;}

// ── Multi-select dropdown (checkbox list) ───────────────────────────────────
function MultiSelectDropdown({options,selectedIds,onToggle,onClear,colors,placeholder}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    function onClickOutside(e){ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown',onClickOutside);
    return ()=>document.removeEventListener('mousedown',onClickOutside);
  },[]);

  const selectedLabel = selectedIds.length===0
    ? (placeholder||'Select…')
    : selectedIds.length===1
      ? (options.find(o=>o.id===selectedIds[0])?.name || '1 selected')
      : selectedIds.length+' machines selected';

  return (
    <div ref={ref} style={{position:'relative',maxWidth:'420px'}}>
      <button
        onClick={()=>setOpen(o=>!o)}
        style={{
          width:'100%',display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px',
          padding:'10px 14px',borderRadius:'8px',border:'1px solid #cbd5e1',background:'#fff',
          cursor:'pointer',fontSize:'13px',fontWeight:600,color:selectedIds.length?'#1e293b':'#94a3b8',
        }}
      >
        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selectedLabel}</span>
        <span style={{transform:open?'rotate(180deg)':'none',transition:'transform .15s',color:'#64748b'}}>▾</span>
      </button>

      {open&&(
        <div style={{
          position:'absolute',top:'calc(100% + 4px)',left:0,right:0,zIndex:30,
          background:'#fff',border:'1px solid #e2e8f0',borderRadius:'10px',
          boxShadow:'0 8px 24px rgba(0,0,0,.12)',maxHeight:'280px',overflowY:'auto',padding:'6px',
        }}>
          {options.length===0?(
            <div style={{padding:'12px',fontSize:'12px',color:'#94a3b8',textAlign:'center'}}>No options available</div>
          ):options.map((o,i)=>{
            const isSel=selectedIds.includes(o.id);
            const color=colors?colors[i%colors.length]:'#2563eb';
            return (
              <label key={o.id} style={{
                display:'flex',alignItems:'center',gap:'10px',padding:'8px 10px',borderRadius:'8px',
                cursor:'pointer',background:isSel?color+'14':'transparent',
              }}>
                <input type="checkbox" checked={isSel} onChange={()=>onToggle(o.id)} style={{width:'15px',height:'15px',accentColor:color,cursor:'pointer'}}/>
                <span style={{width:'8px',height:'8px',borderRadius:'50%',background:color,flexShrink:0}}/>
                <span style={{fontSize:'13px',fontWeight:isSel?700:500,color:isSel?color:'#374151'}}>{o.name}</span>
              </label>
            );
          })}
          {selectedIds.length>0&&(
            <div style={{borderTop:'1px solid #f1f5f9',marginTop:'4px',paddingTop:'6px'}}>
              <button
                onClick={()=>{onClear();}}
                style={{width:'100%',padding:'8px',fontSize:'12px',fontWeight:600,color:'#dc2626',background:'#fef2f2',border:'none',borderRadius:'6px',cursor:'pointer'}}
              >
                ✕ Clear all ({selectedIds.length})
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function useWS(room,onEvent){
  const ref=useRef(null);
  useEffect(()=>{
    const token=localStorage.getItem('cmms_token');
    if(!token||!room) return;
    let ws,timer;
    function connect(){
      try{
        ws=new WebSocket(window.WS_BASE+'/ws/'+room+'?token='+token);
        ref.current=ws;
        ws.onmessage=e=>{try{onEvent&&onEvent(JSON.parse(e.data));}catch(x){}};
        ws.onclose=e=>{if(e.code!==4001) timer=setTimeout(connect,3000);};
      }catch(e){}
    }
    connect();
    const ping=setInterval(()=>{if(ws&&ws.readyState===1) ws.send('ping');},30000);
    return()=>{clearInterval(ping);clearTimeout(timer);if(ws) ws.close();};
  },[room]);
}

// Force UTC parsing: backend returns timestamps without Z suffix e.g. "2026-05-20T08:00:00"
// JavaScript reads those as LOCAL time which causes ~8h offset for UTC+8 (Malaysia).
// Appending Z tells JS to treat it as UTC, matching the server clock.
function toUTC(d){
  if (!d) return null;
  const s = String(d);
  // Already has timezone info (Z or +HH:MM) — leave as-is
  if (s.endsWith('Z') || /[+-]\d{2}:\d{2}$/.test(s)) return new Date(s);
  // No timezone suffix — backend sent UTC without Z, force it
  return new Date(s + 'Z');
}

function fmtDate(d){
  const dt = toUTC(d);
  return dt ? dt.toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'}) : '—';
}
function fmtDT(d){
  const dt = toUTC(d);
  return dt ? dt.toLocaleString('en-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
}
function relativeTime(iso){
  if(!iso) return 'Never';
  const dt=toUTC(iso);
  if(!dt) return 'Never';
  const days=Math.floor((Date.now()-dt.getTime())/86400000);
  if(days<1) return 'Today';
  if(days===1) return '1 day ago';
  if(days<30) return days+' days ago';
  const months=Math.floor(days/30);
  return months===1?'1 month ago':months+' months ago';
}

// Calculate downtime between two UTC timestamps
function calcDowntime(from, to){
  if (!from) return {hours: 0, display: '—'};
  const start = toUTC(from);
  const end   = to ? toUTC(to) : new Date();   // new Date() is always correct local=UTC
  const ms    = end - start;
  if (ms < 0) return {hours: 0, display: '0h 0m'};
  const totalMins = Math.floor(ms / 60000);
  const h = Math.floor(totalMins / 60);
  const m = totalMins % 60;
  return {hours: parseFloat((totalMins/60).toFixed(2)), display: `${h}h ${m}m`};
}

// Photo upload mini-component
function PhotoUploader({photos, setPhotos, maxPhotos=3}){
  function handleFiles(files){
    const remaining = maxPhotos - photos.length;
    Array.from(files).slice(0, remaining).forEach(file=>{
      if (!file.type.startsWith('image/')) return;
      if (file.size > 5*1024*1024) { toast('Photo too large (max 5MB)','err'); return; }
      const reader = new FileReader();
      reader.onload = e => setPhotos(prev=>[...prev, {file, dataUrl:e.target.result}]);
      reader.readAsDataURL(file);
    });
  }
  return (
    <div>
      {photos.length < maxPhotos && (
        <label className="upload-zone" style={{display:'block',cursor:'pointer'}}>
          <div style={{fontSize:'24px',marginBottom:'4px'}}>📷</div>
          <div style={{fontSize:'13px',color:'#64748b'}}>Tap to add photo (max {maxPhotos})</div>
          <input type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>{handleFiles(e.target.files);e.target.value='';}}/>
        </label>
      )}
      {photos.length > 0 && (
        <div className="prev-grid">
          {photos.map((p,i)=>(
            <div key={i} className="prev-item">
              <img src={p.dataUrl} alt="preview"/>
              <button className="prev-rm" onClick={()=>setPhotos(prev=>prev.filter((_,idx)=>idx!==i))}>×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Photo viewer — shows thumbnails, click to fullscreen
function PhotoViewer({photos, label}){
  const [viewing, setViewing] = useState(null);
  if (!photos || photos.length === 0) return null;
  return (
    <div>
      {label && <div style={{fontSize:'12px',color:'#64748b',marginBottom:'6px'}}>{label}</div>}
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        {photos.map((src,i)=>(
          <img key={i} src={src} alt={'photo '+(i+1)} className="photo-thumb" onClick={()=>setViewing(src)}/>
        ))}
      </div>
      {viewing && (
        <div className="modal-bg" onClick={()=>setViewing(null)}>
          <div style={{maxWidth:'90vw',maxHeight:'90vh',padding:'16px'}}>
            <img src={viewing} className="photo-full" alt="full view"/>
            <div style={{textAlign:'center',marginTop:'10px',color:'#fff',fontSize:'13px'}}>Tap anywhere to close</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Login ──────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  async function submit(e){
    e.preventDefault();setLoading(true);setErr('');
    try{
      const body=new URLSearchParams({username:email,password:pw});
      const res=await fetch(window.API_BASE+'/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
      if(!res.ok){const d=await res.json();throw new Error(d.detail||'Login failed');}
      const data=await res.json();
      localStorage.setItem('cmms_token',data.access_token);
      const me=await api('/auth/me');
      onLogin(me);
    }catch(ex){setErr(ex.message);}finally{setLoading(false);}
  }
  return (
    <div style={{minHeight:'100vh',background:'#1e293b',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{background:'#fff',borderRadius:'20px',padding:'40px',width:'100%',maxWidth:'400px',margin:'16px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom:'32px'}}>
          <div style={{width:'44px',height:'44px',background:'#2563eb',borderRadius:'12px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px'}}>🔧</div>
          <div><div style={{fontWeight:800,fontSize:'18px',color:'#1e293b'}}>CMMS Pro</div><div style={{fontSize:'12px',color:'#94a3b8'}}>Maintenance Management System</div></div>
        </div>
        <form onSubmit={submit}>
          <div style={{marginBottom:'14px'}}><label className="lbl">Email</label><input className="inp" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="admin@cmms.com" required/></div>
          <div style={{marginBottom:'18px'}}><label className="lbl">Password</label><input className="inp" type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="password123" required/></div>

          <button className="btn btn-primary" type="submit" disabled={loading} style={{width:'100%',padding:'10px'}}>{loading?'Signing in…':'Sign in'}</button>
        </form>
        <div style={{marginTop:'18px',padding:'14px',background:'#f8fafc',borderRadius:'10px',fontSize:'12px',color:'#64748b'}}><strong>Demo:</strong> admin@cmms.com / password123</div>
      </div>
    </div>
  );
}

            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:'12px'}}>

                return (
                  <div key={t.id} style={{

        {/* Charts */}
        {RC&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px'}}>
          <div className="card"><h3 style={{fontWeight:700,color:'#1e293b',marginBottom:'14px',fontSize:'14px'}}>Work Orders by Status</h3>

function MaintenanceAlertBoard(){
  const [wos,setWos]=useState([]);
  const [technicians,setTechnicians]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [priority,setPriority]=useState('medium');
  const [dueDate,setDueDate]=useState('');
  const [assignNotes,setAssignNotes]=useState('');
  const [assignTechIds,setAssignTechIds]=useState([]); // multi-select
  const [assigning,setAssigning]=useState(false);
  const [soundEnabled,setSoundEnabled]=useState(false);
  const soundEnabledRef=useRef(false);
  const [now,setNow]=useState(Date.now());
  const knownOpenRef=useRef(new Set());
  const loadedRef=useRef(false);
  const audioRef=useRef(null);

  async function beep(force=false){
    if(!force&&!soundEnabledRef.current) return;
    try{
      const Ctx=window.AudioContext||window.webkitAudioContext;
      const ctx=audioRef.current||new Ctx();
      audioRef.current=ctx;
      if(ctx.state==='suspended') await ctx.resume();
      for(let i=0;i<3;i++){
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.type='sine'; osc.frequency.value=880; gain.gain.value=0.12;
        osc.connect(gain); gain.connect(ctx.destination);
        const t=ctx.currentTime+(i*0.28);
        osc.start(t); osc.stop(t+0.16);
      }
    }catch(e){}
  }
  async function enableSound(){
    try{
      const Ctx=window.AudioContext||window.webkitAudioContext;
      audioRef.current=audioRef.current||new Ctx();
      if(audioRef.current.state==='suspended') await audioRef.current.resume();
      soundEnabledRef.current=true;
      setSoundEnabled(true);
      setTimeout(()=>beep(true),50);
    }catch(e){toast('Sound is blocked by this browser','err');}
  }

  // Returns array of {id,name} from backend's assigned_users; falls back to parsing legacy description text
  function getAssignedList(wo){
    if(wo.assigned_users&&wo.assigned_users.length>0) return wo.assigned_users;
    const m=(wo.description||'').match(/Assigned to\s*:\s*([^\n]+)/);
    if(!m) return [];
    return m[1].split(',').map(s=>({id:null,name:s.trim().replace(/\s*\([^)]*\)/,'')}));
  }

  async function load({alert=false}={}){
    try{
      const [open,inp,hold,techs]=await Promise.all([
        api('/work-orders/?status=open&limit=200'),
        api('/work-orders/?status=in_progress&limit=200'),
        api('/work-orders/?status=on_hold&limit=200'),
        api('/users/technicians'),
      ]);
      const merged=[...open,...inp,...hold].sort((a,b)=>{const p={critical:0,high:1,medium:2,low:3};return (p[a.priority]||2)-(p[b.priority]||2)||new Date(a.created_at)-new Date(b.created_at);});
      const incomingIds=new Set(open.map(w=>w.id));
      if(loadedRef.current){
        const hasNew=[...incomingIds].some(id=>!knownOpenRef.current.has(id));
        if(hasNew||alert) beep();
      }
      knownOpenRef.current=incomingIds; loadedRef.current=true;
      setWos(merged); setTechnicians(techs);
    }catch(e){toast(e.message,'err');}
    finally{setLoading(false);}
  }

  useEffect(()=>{load();},[]);
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(t);},[]);
  useWS('work_orders',ev=>{load({alert:ev.type==='work_order.created'});});
  useWS('requests',ev=>{if(ev.type==='request.new'){toast('New work order request','info');load({alert:true});}});
  useWS('users',()=>load()); // refresh assignable list live when attendance changes

  function openAssign(wo){
    setSelected(wo);
    setPriority(wo.priority||'medium');
    setDueDate('');
    setAssignNotes('');
    // Pre-tick whoever is currently assigned (if they're still in the assignable list)
    const existing=getAssignedList(wo).map(u=>u.id).filter(Boolean);
    setAssignTechIds(existing);
  }
  function toggleTech(id){
    setAssignTechIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  }
  async function assign(){
    if(!selected) return;
    if(assignTechIds.length===0){toast('Please select at least one technician','err');return;}
    setAssigning(true);
    try{
      await api('/work-orders/'+selected.id+'/assign',{method:'POST',body:JSON.stringify({user_ids:assignTechIds,priority,due_date:dueDate?new Date(dueDate).toISOString():null,notes:assignNotes||null})});
      const names=technicians.filter(t=>assignTechIds.includes(t.id)).map(t=>t.name).join(', ');
      toast('Assigned to '+names); setSelected(null); load();
    }catch(e){toast(e.message,'err');}
    finally{setAssigning(false);}
  }

  const incoming=wos.filter(w=>w.status==='open');
  const active=wos.filter(w=>w.status!=='open');
  const critical=wos.filter(w=>w.priority==='critical').length;

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'14px',marginBottom:'20px'}}>
      <div><h1 style={{fontSize:'28px',fontWeight:900,color:'#1e293b',margin:0}}>Maintenance Alert Board</h1><p style={{color:'#64748b',fontSize:'14px',margin:'4px 0 0'}}>Live incoming work orders, assignment, and running downtime</p></div>
      <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
        {incoming.length>0&&<span className="new-pulse" style={{background:'#fee2e2',color:'#991b1b',padding:'8px 14px',borderRadius:'999px',fontSize:'13px',fontWeight:800}}>NEW {incoming.length}</span>}
        {critical>0&&<span className="new-pulse" style={{background:'#7f1d1d',color:'#fff',padding:'8px 14px',borderRadius:'999px',fontSize:'13px',fontWeight:800}}>CRITICAL {critical}</span>}
        <button className={soundEnabled?'btn btn-success':'btn btn-secondary'} onClick={enableSound}>{soundEnabled?'Sound On':'Enable Sound'}</button>
        <button className="btn btn-secondary" onClick={()=>load()}>Refresh</button>
      </div>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:'14px',marginBottom:'18px'}}>
      {[['Incoming',incoming.length,'#fee2e2','#991b1b'],['Active',active.length,'#dbeafe','#1e40af'],['Critical',critical,'#7f1d1d','#fff'],['Assignable',technicians.length,'#dcfce7','#166534']].map(([label,value,bg,color])=>(
        <div key={label} className="card" style={{background:bg,padding:'18px'}}><div style={{fontSize:'34px',fontWeight:900,color,lineHeight:1}}>{value}</div><div style={{fontSize:'13px',fontWeight:700,color:color==='#fff'?'#fecaca':'#475569',marginTop:'4px'}}>{label}</div></div>
      ))}
    </div>

    {loading?<Spinner/>:wos.length===0?<Empty msg="No active work orders"/>:<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:'14px'}}>
      {wos.map(w=>{
        const assignedList=getAssignedList(w);
        const assignedLabel=assignedList.length===0?null:assignedList.length===1?assignedList[0].name:assignedList[0].name+' +'+(assignedList.length-1)+' more';
        const dt=calcDowntime(w.created_at,null);const isIncoming=w.status==='open';const isCritical=w.priority==='critical';
        return (
        <div key={w.id} className={isIncoming?'new-pulse':''} style={{background:isCritical?'#450a0a':isIncoming?'#fff7ed':'#fff',color:isCritical?'#fff':'#1e293b',border:'2px solid '+(isCritical?'#ef4444':isIncoming?'#f97316':'#e2e8f0'),borderRadius:'14px',padding:'18px',boxShadow:isIncoming?'0 10px 22px rgba(249,115,22,.18)':'0 1px 3px rgba(0,0,0,.06)'}}>
          <div style={{display:'flex',justifyContent:'space-between',gap:'10px',alignItems:'flex-start',marginBottom:'12px'}}>
            <div><div style={{fontFamily:'monospace',fontSize:'13px',fontWeight:800,color:isCritical?'#fecaca':'#2563eb'}}>{w.wo_number}</div><div style={{fontSize:'20px',fontWeight:900,marginTop:'3px'}}>{w.asset?.name||w.title}</div><div style={{fontSize:'12px',color:isCritical?'#fecaca':'#64748b',marginTop:'3px'}}>{w.asset?.location||'No location'}</div></div>
            <div style={{display:'flex',gap:'6px',flexWrap:'wrap',justifyContent:'flex-end'}}><Badge value={w.priority}/><Badge value={w.status}/></div>
          </div>
          <div style={{background:isCritical?'rgba(255,255,255,.08)':'#f8fafc',borderRadius:'10px',padding:'12px',marginBottom:'12px'}}><div style={{fontSize:'12px',color:isCritical?'#fecaca':'#64748b',fontWeight:700}}>RUNNING DOWNTIME</div><div style={{fontSize:'34px',fontWeight:900,color:isCritical?'#fff':'#b45309',lineHeight:1.1}}>{dt.display}</div><div style={{fontSize:'11px',color:isCritical?'#fecaca':'#94a3b8',marginTop:'4px'}}>Started {fmtDT(w.created_at)}</div></div>
          <div style={{fontSize:'13px',color:isCritical?'#fee2e2':'#374151',whiteSpace:'pre-line',maxHeight:'70px',overflow:'hidden',marginBottom:'12px'}}>{(w.description||w.title||'No description').split('\n').filter(l=>l.startsWith('Category')||l.startsWith('Problem')||l.startsWith('Remarks')||l.startsWith('Assigned')).join('\n')||w.title}</div>
          {assignedList.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'10px'}}>
            {assignedList.map((u,i)=><span key={u.id||i} style={{background:isCritical?'rgba(255,255,255,.15)':'#ede9fe',color:isCritical?'#fff':'#5b21b6',padding:'2px 9px',borderRadius:'999px',fontSize:'11px',fontWeight:700}}>👷 {u.name}</span>)}
          </div>}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'10px'}}>
            <div style={{fontSize:'12px',fontWeight:700,color:isCritical?'#fecaca':assignedLabel?'#5b21b6':'#dc2626'}}>{assignedLabel?'Assigned: '+assignedLabel:'Unassigned'}</div>
            <button className="btn btn-primary" onClick={()=>openAssign(w)}>{assignedLabel?'Reassign':'Assign'}</button>
          </div>
        </div>
      );})}
    </div>}

    {selected&&<Modal title={'Assign: '+selected.wo_number} onClose={()=>setSelected(null)} large><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px'}}>
      <div>
        <div className="section-title">Work Order</div>
        <div style={{background:'#f8fafc',borderRadius:'10px',padding:'14px',fontSize:'13px',lineHeight:1.7}}>
          <div style={{fontWeight:800,fontSize:'16px',color:'#1e293b'}}>{selected.asset?.name||selected.title}</div>
          <div><strong>Downtime:</strong> {calcDowntime(selected.created_at,null).display}</div>
          <div><strong>Priority:</strong> <Badge value={selected.priority}/></div>
          <div><strong>Status:</strong> <Badge value={selected.status}/></div>
          <div style={{whiteSpace:'pre-line',marginTop:'8px'}}>{selected.description||'No description'}</div>
        </div>
      </div>
      <div style={{display:'grid',gap:'12px'}}>
        <div>
          <label className="lbl">Assign Technicians {assignTechIds.length>0&&<span style={{color:'#2563eb',fontWeight:700}}>({assignTechIds.length} selected)</span>}</label>
          {technicians.length===0
            ?<div style={{color:'#dc2626',fontSize:'13px',padding:'10px',background:'#fef2f2',borderRadius:'8px'}}>No staff marked present today.</div>
            :<div style={{display:'flex',flexDirection:'column',gap:'6px',maxHeight:'220px',overflowY:'auto',border:'1px solid #e2e8f0',borderRadius:'10px',padding:'6px'}}>
              {technicians.map(t=>{
                const isChecked=assignTechIds.includes(t.id);
                return (
                  <label key={t.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 10px',borderRadius:'8px',cursor:'pointer',background:isChecked?'#eff6ff':'transparent'}}>
                    <input type="checkbox" checked={isChecked} onChange={()=>toggleTech(t.id)} style={{width:'16px',height:'16px',accentColor:'#2563eb',cursor:'pointer'}}/>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:'13px',color:'#1e293b'}}>{t.name}</div>
                      <div style={{fontSize:'11px',color:'#64748b',textTransform:'capitalize'}}>{t.role}</div>
                    </div>
                    {isChecked&&<span style={{fontSize:'11px',color:'#2563eb',fontWeight:700}}>✓</span>}
                  </label>
                );
              })}
            </div>
          }
        </div>
        <div><label className="lbl">Priority</label><select className="inp" value={priority} onChange={e=>setPriority(e.target.value)}>{['low','medium','high','critical'].map(p=><option key={p} value={p}>{p}</option>)}</select></div>
        <div><label className="lbl">Due Date</label><input type="datetime-local" className="inp" value={dueDate} onChange={e=>setDueDate(e.target.value)}/></div>
        <div><label className="lbl">Notes</label><textarea className="inp" rows={3} value={assignNotes} onChange={e=>setAssignNotes(e.target.value)}/></div>
        <div style={{display:'flex',gap:'10px'}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={assign} disabled={assigning||assignTechIds.length===0}>{assigning?'Assigning...':'Confirm Assignment'+(assignTechIds.length>0?' ('+assignTechIds.length+')':'')}</button>
          <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setSelected(null)}>Cancel</button>
        </div>
      </div>
    </div></Modal>}
  </div>;
}

  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(requestUrl);
  return (
    <div>
      <div style={{marginBottom:'24px'}}>
        <h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>QR Code</h1>
        <p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>One QR code for the entire factory — print and stick on walls or notice boards</p>
      </div>
      <div style={{display:'flex',gap:'24px',flexWrap:'wrap'}}>
        {/* QR Card */}
        <div className="card" style={{textAlign:'center',maxWidth:'340px',flex:'0 0 auto'}}>
          <div style={{fontSize:'32px',marginBottom:'8px'}}>🔲</div>
          <h2 style={{fontWeight:800,color:'#1e293b',marginBottom:'4px',fontSize:'18px'}}>Machine Repair Request</h2>
          <p style={{color:'#64748b',fontSize:'13px',marginBottom:'20px'}}>Scan to report any machine problem</p>
          <img src={qrUrl} alt="QR Code" style={{borderRadius:'12px',border:'1px solid #e2e8f0',marginBottom:'16px',width:'240px',height:'240px'}}/>
          <div style={{fontSize:'11px',color:'#94a3b8',wordBreak:'break-all',marginBottom:'16px'}}>{requestUrl}</div>
          <div style={{display:'flex',gap:'10px',justifyContent:'center'}}>
            <button className="btn btn-primary" onClick={()=>window.open('/qr','_blank')}>🖨️ Open Print View</button>
            <a href={requestUrl} target="_blank" style={{textDecoration:'none'}}>
              <button className="btn btn-secondary">🔗 Open Form</button>
            </a>
          </div>
        </div>

        {/* Instructions */}
        <div style={{flex:1,minWidth:'260px'}}>
          <div className="card" style={{marginBottom:'14px'}}>
            <h3 style={{fontWeight:700,color:'#1e293b',marginBottom:'12px',fontSize:'14px'}}>How it works</h3>
            {[
              ['1','Operator scans the QR code with phone camera'],
              ['2','Form opens — choose machine, problem type, describe the issue'],
              ['3','Optional: take and upload a photo of the problem'],
              ['4','Submit — admin is notified instantly'],
              ['5','Admin reviews and assigns to technician'],
            ].map(([n,t])=>(
              <div key={n} style={{display:'flex',gap:'12px',alignItems:'flex-start',marginBottom:'10px'}}>
                <div style={{width:'24px',height:'24px',background:'#2563eb',borderRadius:'50%',color:'#fff',fontWeight:700,fontSize:'12px',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{n}</div>
                <div style={{fontSize:'13px',color:'#374151',paddingTop:'3px'}}>{t}</div>
              </div>
            ))}
          </div>
          <div className="card" style={{background:'#eff6ff',border:'1px solid #bfdbfe'}}>
            <h3 style={{fontWeight:700,color:'#1e40af',marginBottom:'8px',fontSize:'13px'}}>💡 Printing tip</h3>
            <p style={{fontSize:'13px',color:'#1e40af',lineHeight:1.6}}>Click "Open Print View" to get a clean printable version. Print A4 size and laminate for best results. One QR code works for all machines — operator selects the machine from a dropdown on the form.</p>
          </div>
        </div>
      </div>
    </div>
  );
}


// ── Technician Board ───────────────────────────────────────────────────────
function TechnicianBoard(){
  const {user}=useAuth();
  const isAdminOrManager=user&&(user.role==='admin'||user.role==='manager');
  const [wos,setWos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [completing,setCompleting]=useState(null);
  const [parts,setParts]=useState([]);
  const [partsModal,setPartsModal]=useState(null);
  const [filterStatus,setFilterStatus]=useState('');

  // Completion form state
  const [rootCause,setRootCause]=useState('');
  const [actions,setActions]=useState('');
  const [actualHours,setActualHours]=useState('');
  const [affectedDowntime,setAffectedDowntime]=useState(true);
  const [remarks,setRemarks]=useState('');
  const [usedParts,setUsedParts]=useState([]);
  const [compPhotos,setCompPhotos]=useState([]);
  const [submitting,setSubmitting]=useState(false);
  const [autoDowntime,setAutoDowntime]=useState({hours:0,display:'—'});
  const timerRef=useRef(null);
  // Parts Used — search & barcode scan
  const [partsSearch,setPartsSearch]=useState('');
  const [partsScanOpen,setPartsScanOpen]=useState(false);
  const [partsScanError,setPartsScanError]=useState('');
  const [partsScanStarting,setPartsScanStarting]=useState(false);
  const partsHtml5QrRef=useRef(null);
  const partsCameraStartedRef=useRef(false);

  async function load(){
    try{
      const scope='&my_jobs_only='+(!isAdminOrManager);
      const all=filterStatus
        ?await api('/work-orders/?status='+filterStatus+'&limit=100'+scope)
        :[...await api('/work-orders/?status=open&limit=100'+scope),...await api('/work-orders/?status=in_progress&limit=100'+scope)];
      setWos(all.sort((a,b)=>{const p={critical:0,high:1,medium:2,low:3};return (p[a.priority]||2)-(p[b.priority]||2);}));
    }catch(e){toast(e.message,'err');}finally{setLoading(false);}
  }
  async function loadParts(woId){try{setParts(await api('/work-orders/'+woId+'/parts-availability'));}catch(e){toast(e.message,'err');}}
  useEffect(()=>{load();},[filterStatus]);
  useWS('work_orders',load);

  // Live downtime timer while completion modal is open
  useEffect(()=>{
    if (!completing) return;
    function tick(){ setAutoDowntime(calcDowntime(completing.created_at, null)); }
    tick();
    timerRef.current = setInterval(tick, 60000);
    return ()=>clearInterval(timerRef.current);
  },[completing]);

  function openComplete(wo){
    setCompleting(wo);
    setRootCause('');setActions('');setActualHours('');setAffectedDowntime(wo.affected_downtime!==false);setRemarks('');setUsedParts([]);setCompPhotos([]);setPartsSearch('');
    loadParts(wo.id);
  }

  function togglePart(part){
    const exists=usedParts.find(p=>p.spare_part_id===part.id);
    if(exists) setUsedParts(usedParts.filter(p=>p.spare_part_id!==part.id));
    else setUsedParts([...usedParts,{spare_part_id:part.id,quantity_used:1,name:part.name,available:part.quantity_on_hand}]);
  }
  function updateQty(id,qty){setUsedParts(usedParts.map(p=>p.spare_part_id===id?{...p,quantity_used:parseInt(qty)||1}:p));}

  // ── Parts Used: barcode scan to find + auto-tick a part ──
  async function startPartsCamera(){
    if(typeof Html5Qrcode==='undefined'){
      setPartsScanError('Camera scanner library failed to load. Check your internet connection.');
      return;
    }
    setPartsScanOpen(true);setPartsScanError('');setPartsScanStarting(true);
    setTimeout(async()=>{
      try{
        if(!partsHtml5QrRef.current) partsHtml5QrRef.current=new Html5Qrcode('camera-view-partsused',{
          useBarCodeDetectorIfSupported:true,
          verbose:false,
        });
        const config={
          fps:8,
          qrbox:(vw,vh)=>{
            const w=Math.floor(Math.min(vw,vh)*0.85);
            return {width:w,height:Math.floor(w*0.4)};
          },
          aspectRatio:1.7777778,
          disableFlip:false,
        };
        await partsHtml5QrRef.current.start(
          {facingMode:'environment'},
          config,
          (decodedText)=>{ onPartsCodeDetected(decodedText); },
          ()=>{},
        );
        partsCameraStartedRef.current=true;
      }catch(err){
        setPartsScanError(
          err && err.toString && err.toString().includes('NotAllowedError')
            ? 'Camera permission denied. Please allow camera access and try again.'
            : 'Could not start camera: '+(err?.message||err)
        );
        partsCameraStartedRef.current=false;
      }finally{
        setPartsScanStarting(false);
      }
    },50);
  }
  async function stopPartsCamera(){
    try{
      if(partsHtml5QrRef.current&&partsCameraStartedRef.current){
        await partsHtml5QrRef.current.stop();
        partsHtml5QrRef.current.clear();
      }
    }catch(e){}
    partsCameraStartedRef.current=false;
    setPartsScanOpen(false);setPartsScanError('');
  }
  function onPartsCodeDetected(decodedText){
    if(!decodedText) return;
    stopPartsCamera();
    const code=decodedText.trim().toLowerCase();
    const match=parts.find(p=>(p.barcode||'').toLowerCase()===code||(p.part_code||'').toLowerCase()===code);
    if(!match){
      toast('No part found for "'+decodedText+'"','err');
      setPartsSearch(decodedText);
      return;
    }
    if(!usedParts.find(x=>x.spare_part_id===match.id)) togglePart(match);
    setPartsSearch('');
    toast('✅ Added: '+match.name);
  }
  useEffect(()=>{
    return ()=>{
      if(partsHtml5QrRef.current&&partsCameraStartedRef.current){
        partsHtml5QrRef.current.stop().then(()=>partsHtml5QrRef.current.clear()).catch(()=>{});
      }
    };
  },[]);

  async function submitCompletion(){
    if(!rootCause){toast('Please select a root cause','err');return;}
    if(!actions.trim()){toast('Please describe actions taken','err');return;}
    const hrs = parseFloat(actualHours) || autoDowntime.hours;
    if(!hrs){toast('Please enter actual hours','err');return;}
    for(const p of usedParts){
      if(p.quantity_used>p.available){toast('Insufficient stock for '+p.name,'err');return;}
    }
    setSubmitting(true);
    try{
      // Convert photos
      const photoData=compPhotos.map(p=>({filename:p.file.name,data:p.dataUrl,size:p.file.size}));
      await api('/work-orders/'+completing.id+'/complete',{
        method:'POST',
        body:JSON.stringify({
          root_cause:rootCause,
          actions_taken:actions,
          actual_hours:hrs,
          affected_downtime:affectedDowntime,
          remarks:remarks||null,
          parts_used:usedParts.map(p=>({spare_part_id:p.spare_part_id,quantity_used:p.quantity_used})),
          completion_photos:photoData,
        })
      });
      toast('Work order completed!');setCompleting(null);load();
    }catch(e){toast(e.message,'err');}finally{setSubmitting(false);}
  }

  async function updateStatus(id,status){try{await api('/work-orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load();}catch(e){toast(e.message,'err');}}

  function extractPhotos(wo){
    const desc=wo.description||'';
    const photos=[];
    const re=/\[PHOTO:([^\|]+)\|([^\]]+)\]/g;
    let m;
    while((m=re.exec(desc))!==null){
      if(m[2]!=='TOO_LARGE') photos.push(m[2]);
    }
    return photos;
  }
  const priorityBorder={critical:'#ef4444',high:'#f97316',medium:'#f59e0b',low:'#3b82f6'};
  const priorityBg={critical:'#fef2f2',high:'#fff7ed',medium:'#fefce8',low:'#f0f9ff'};

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div><h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>Work Order Board</h1><p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>{isAdminOrManager?'All open work orders — sorted by priority':'Your assigned work orders — sorted by priority'}</p></div>
        <span style={{background:'#f0fdf4',color:'#16a34a',border:'1px solid #bbf7d0',padding:'6px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:600}}>● Live</span>
      </div>

      <div style={{display:'flex',gap:'8px',marginBottom:'16px',flexWrap:'wrap'}}>
        {[['','All Open'],['open','Open'],['in_progress','In Progress'],['on_hold','On Hold']].map(([s,l])=>(
          <button key={s} onClick={()=>setFilterStatus(s)} style={{padding:'5px 14px',borderRadius:'999px',fontSize:'12px',fontWeight:600,border:'1px solid',cursor:'pointer',
            borderColor:filterStatus===s?'#2563eb':'#e2e8f0',background:filterStatus===s?'#2563eb':'#fff',color:filterStatus===s?'#fff':'#64748b'}}>
            {l}
          </button>
        ))}
      </div>

      {loading?<Spinner/>:wos.length===0?<Empty msg="No open work orders — great job! 🎉"/>:(
        <div>{wos.map(w=>{
          const photos=extractPhotos(w);
          const dt=calcDowntime(w.created_at,null);
          return (
            <div key={w.id} className="wo-card" style={{borderLeft:'4px solid '+(priorityBorder[w.priority]||'#e2e8f0'),background:priorityBg[w.priority]||'#fff'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'12px'}}>
                <div style={{flex:1}}>
                  <div style={{display:'flex',gap:'6px',alignItems:'center',marginBottom:'8px',flexWrap:'wrap'}}>
                    <span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px',fontWeight:700}}>{w.wo_number}</span>
                    <Badge value={w.priority}/><Badge value={w.status}/>{w.type&&<Badge value={w.type}/>}<Badge value={w.affected_downtime===false?'non_affected':'affected'}/>
                  </div>
                  <div style={{fontWeight:700,color:'#1e293b',fontSize:'15px',marginBottom:'4px'}}>{w.title}</div>
                  <div style={{fontSize:'12px',color:'#64748b',marginBottom:'6px'}}>
                    🏭 {w.asset?.name||'—'} &nbsp;·&nbsp; 📍 {w.asset?.location||'—'}
                  </div>
                  {w.description&&<div style={{fontSize:'12px',color:'#374151',background:'rgba(255,255,255,0.7)',borderRadius:'6px',padding:'8px 10px',marginBottom:'8px',whiteSpace:'pre-line',maxHeight:'80px',overflow:'hidden'}}>{w.description}</div>}

                  {/* Operator photos shown on board */}
                  {photos.length>0&&(
                    <div style={{marginBottom:'8px'}}>
                      <div style={{fontSize:'11px',color:'#64748b',marginBottom:'4px'}}>📷 Operator photos:</div>
                      <PhotoViewer photos={photos}/>
                    </div>
                  )}

                  <div style={{fontSize:'11px',color:'#94a3b8'}}>
                    Created: {fmtDT(w.created_at)}
                    {w.due_date&&<span style={{marginLeft:'12px',color:toUTC(w.due_date)<new Date()?'#dc2626':'#64748b'}}> · Due: {fmtDate(w.due_date)}</span>}
                    <span style={{marginLeft:'12px',color:'#b45309',fontWeight:600}}>⏱ Waiting: {dt.display}</span>
                  </div>
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:'6px',minWidth:'130px'}}>
                  <button className="btn btn-success" style={{fontSize:'12px',padding:'7px 12px'}} onClick={()=>openComplete(w)}>✅ Complete Job</button>
                  <button className="btn btn-secondary" style={{fontSize:'12px',padding:'7px 12px'}} onClick={async()=>{setPartsModal(w);await loadParts(w.id);}}>🔩 Check Parts</button>
                  <select className="inp" style={{fontSize:'12px',padding:'6px 8px'}} value={w.status} onChange={e=>updateStatus(w.id,e.target.value)}>
                    {['open','in_progress','on_hold','cancelled'].map(s=><option key={s} value={s}>{s.replace(/_/g,' ')}</option>)}
                  </select>
                </div>
              </div>
            </div>
          );
        })}</div>
      )}

      {/* Parts availability modal */}
      {partsModal&&(
        <Modal title={'Spare Parts — '+partsModal.asset?.name} onClose={()=>setPartsModal(null)} large>
          <div className="section-title">Parts availability check</div>
          <div style={{maxHeight:'400px',overflowY:'auto'}}>
            {parts.length===0?<Empty msg="No parts in inventory"/>:parts.map(p=>(
              <div key={p.id} className="part-row">
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:'13px',color:'#1e293b'}}>{p.name}</div>
                  <div style={{fontSize:'11px',color:'#64748b'}}>{p.part_code} · {p.location||'—'}</div>
                </div>
                <div style={{textAlign:'right',minWidth:'90px'}}>
                  <div style={{fontWeight:700,color:p.quantity_on_hand===0?'#dc2626':p.is_low_stock?'#ea580c':'#16a34a'}}>{p.quantity_on_hand} {p.unit}</div>
                  <div style={{fontSize:'11px',color:'#94a3b8'}}>Min: {p.reorder_level}</div>
                </div>
                <div style={{width:'60px',textAlign:'center',fontSize:'11px',fontWeight:700,color:p.quantity_on_hand===0?'#dc2626':p.is_low_stock?'#ea580c':'#16a34a'}}>
                  {p.quantity_on_hand===0?'OUT':p.is_low_stock?'LOW':'OK'}
                </div>
              </div>
            ))}
          </div>
        </Modal>
      )}

      {/* Completion form modal */}
      {completing&&(
        <Modal title={'Complete Work Order: '+completing.wo_number} onClose={()=>setCompleting(null)} large>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px'}}>

            {/* Left column */}
            <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
              <div className="section-title">Completion Details</div>

              {/* Auto-calculated downtime display */}
              <div className="dt-box">
                <div className="dt-lbl">⏱ Auto-calculated downtime (from request time)</div>
                <div className="dt-val">{autoDowntime.display}</div>
                <div style={{fontSize:'11px',color:'#92400e',marginTop:'4px'}}>Request time: {fmtDT(completing.created_at)}</div>
              </div>

              <div>
                <label className="lbl">Actual Downtime Hours <span style={{color:'#ef4444'}}>*</span></label>
                <input type="number" step="0.5" min="0.5" className="inp"
                  placeholder={'Auto: '+autoDowntime.hours+' hrs — override if needed'}
                  value={actualHours} onChange={e=>setActualHours(e.target.value)}/>
                <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'4px'}}>Leave blank to use auto-calculated value ({autoDowntime.hours}h)</div>
              </div>

              <div>
                <label className="lbl">Downtime Type</label>
                <select className="inp" value={affectedDowntime?'affected':'non_affected'} onChange={e=>setAffectedDowntime(e.target.value==='affected')}>
                  <option value="affected">Affected downtime</option>
                  <option value="non_affected">Non-affected downtime</option>
                </select>
              </div>

              <div>
                <label className="lbl">Root Cause <span style={{color:'#ef4444'}}>*</span></label>
                <select className="inp" value={rootCause} onChange={e=>setRootCause(e.target.value)}>
                  <option value="">Select root cause…</option>
                  {Object.entries(ROOT_CAUSE_GROUPS).map(([group,items])=>(
                    <optgroup key={group} label={group}>
                      {items.map(rc=><option key={rc} value={rc}>{rc}</option>)}
                    </optgroup>
                  ))}
                </select>
              </div>

              <div>
                <label className="lbl">Actions Taken <span style={{color:'#ef4444'}}>*</span></label>
                <textarea className="inp" rows={4} placeholder="Describe what was done to fix the issue…" value={actions} onChange={e=>setActions(e.target.value)}/>
              </div>

              <div>
                <label className="lbl">Remarks <span style={{fontSize:'11px',fontWeight:400,color:'#94a3b8'}}>(optional)</span></label>
                <textarea className="inp" rows={2} placeholder="Any additional notes…" value={remarks} onChange={e=>setRemarks(e.target.value)}/>
              </div>

              <div>
                <label className="lbl">Completion Photos <span style={{fontSize:'11px',fontWeight:400,color:'#94a3b8'}}>(optional, max 3)</span></label>
                <PhotoUploader photos={compPhotos} setPhotos={setCompPhotos} maxPhotos={3}/>
              </div>
            </div>

            {/* Right column — parts */}
            <div>
              <div className="section-title">Parts Used</div>
              <div style={{fontSize:'12px',color:'#64748b',marginBottom:'10px'}}>Search, scan, or tick each part used. Stock will be auto-deducted.</div>

              <div style={{display:'flex',gap:'8px',marginBottom:'8px'}}>
                <input
                  className="inp"
                  placeholder="Search part name / code, or type barcode…"
                  value={partsSearch}
                  onChange={e=>setPartsSearch(e.target.value)}
                  style={{fontSize:'13px'}}
                />
                <button
                  onClick={partsScanOpen?stopPartsCamera:startPartsCamera}
                  style={{
                    whiteSpace:'nowrap',padding:'0 14px',fontSize:'13px',fontWeight:700,borderRadius:'8px',cursor:'pointer',
                    border:partsScanOpen?'2px solid #dc2626':'2px solid #2563eb',
                    background:partsScanOpen?'#fef2f2':'#eff6ff',
                    color:partsScanOpen?'#dc2626':'#2563eb',
                  }}
                >
                  {partsScanOpen?'✕ Stop':'📷 Scan'}
                </button>
              </div>

              {partsScanOpen&&(
                <div style={{marginBottom:'10px'}}>
                  <div id="camera-view-partsused" style={{width:'100%',borderRadius:'10px',overflow:'hidden',background:'#000',minHeight:'200px'}}/>
                  {partsScanStarting&&<div style={{textAlign:'center',padding:'10px',fontSize:'12px',color:'#64748b'}}>Starting camera…</div>}
                  {partsScanError&&(
                    <div style={{marginTop:'8px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'8px',padding:'10px',fontSize:'12px',color:'#991b1b'}}>
                      ⚠️ {partsScanError}
                    </div>
                  )}
                  {!partsScanError&&!partsScanStarting&&(
                    <div style={{marginTop:'6px',fontSize:'11px',color:'#64748b',textAlign:'center'}}>Point at the part's barcode — it'll be added automatically.</div>
                  )}
                </div>
              )}

              <div style={{maxHeight:'360px',overflowY:'auto',border:'1px solid #f1f5f9',borderRadius:'8px',padding:'8px'}}>
                {parts.length===0?<Empty msg="No parts in inventory"/>:(()=>{
                  const q=partsSearch.trim().toLowerCase();
                  const visible=parts.filter(p=>{
                    const isSelected=usedParts.some(x=>x.spare_part_id===p.id);
                    if(!q) return true;
                    // Always keep already-selected parts visible even while searching,
                    // so the technician doesn't lose track of what's been added.
                    if(isSelected) return true;
                    return p.name.toLowerCase().includes(q)
                      ||(p.part_code||'').toLowerCase().includes(q)
                      ||(p.barcode||'').toLowerCase().includes(q);
                  });
                  if(visible.length===0) return <Empty msg={'No parts match "'+partsSearch+'"'}/>;
                  return visible.map(p=>{
                    const used=usedParts.find(x=>x.spare_part_id===p.id);
                    return (
                      <div key={p.id} style={{display:'flex',alignItems:'center',gap:'8px',padding:'6px 0',borderBottom:'1px solid #f8fafc',background:used?'#f0fdf4':'transparent'}}>
                        <input type="checkbox" checked={!!used} onChange={()=>togglePart(p)} style={{width:'16px',height:'16px',cursor:'pointer'}}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:'13px',fontWeight:600,color:'#1e293b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                          <div style={{fontSize:'11px',color:p.quantity_on_hand===0?'#dc2626':p.is_low_stock?'#ea580c':'#64748b'}}>
                            {p.part_code} · Stock: {p.quantity_on_hand} {p.unit}
                          </div>
                        </div>
                        {used&&<input type="number" min={1} max={p.quantity_on_hand} value={used.quantity_used}
                          onChange={e=>updateQty(p.id,e.target.value)}
                          style={{width:'56px',border:'1px solid #e2e8f0',borderRadius:'6px',padding:'4px 6px',fontSize:'13px',textAlign:'center'}}/>}
                      </div>
                    );
                  });
                })()}
              </div>
              {usedParts.length>0&&<div style={{marginTop:'8px',padding:'8px 12px',background:'#f0fdf4',borderRadius:'8px',fontSize:'12px',color:'#166534'}}>
                ✅ {usedParts.length} part{usedParts.length>1?'s':''} selected
              </div>}

              {/* Show operator photos for reference */}
              {extractPhotos(completing).length>0&&<div style={{marginTop:'16px'}}>
                <div className="section-title">Operator Photos (reference)</div>
                <PhotoViewer photos={extractPhotos(completing)}/>
              </div>}
            </div>
          </div>

          <div style={{display:'flex',gap:'10px',marginTop:'20px',borderTop:'1px solid #f1f5f9',paddingTop:'16px'}}>
            <button className="btn btn-primary" style={{flex:1,padding:'12px'}} onClick={submitCompletion} disabled={submitting}>
              {submitting?'Submitting…':'✅ Submit Completion Report'}
            </button>
            <button className="btn btn-secondary" style={{flex:1,padding:'12px'}} onClick={()=>setCompleting(null)}>Cancel</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── History Log ────────────────────────────────────────────────────────────
function HistoryLog(){
  const {user}=useAuth();
  const isAdmin=user&&user.role==='admin';
  const [wos,setWos]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [statusFilter,setStatusFilter]=useState('completed');
  const [selected,setSelected]=useState(null);
  const [editing,setEditing]=useState(null);   // wo being edited
  const [editForm,setEditForm]=useState({});    // edit field values
  const [saving,setSaving]=useState(false);
  const [dateFrom,setDateFrom]=useState('');
  const [dateTo,setDateTo]=useState('');
  const [locationFilter,setLocationFilter]=useState('');
  const [locations,setLocations]=useState([]);
  const [analysis,setAnalysis]=useState(null);
  const [analysisLoading,setAnalysisLoading]=useState(true);
  // ── Per-machine comparison ──
  const [allAssets,setAllAssets]=useState([]);
  const [selectedAssetIds,setSelectedAssetIds]=useState([]);
  const [machineTimeline,setMachineTimeline]=useState(null);
  const [machineTimelineLoading,setMachineTimelineLoading]=useState(true);
  // ── Real-time uptime ──
  const [uptime,setUptime]=useState(null);
  const [hoursPerDay,setHoursPerDay]=useState(19);
  const [analysisTab,setAnalysisTab]=useState('uptime'); // 'uptime' | 'downtime' | 'by_machine'
  const RC=window.Recharts;
  const MACHINE_COLORS=['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#0d9488'];

  async function loadAssetsList(){
    try{setAllAssets(await api('/analysis/assets'));}catch(e){}
  }
  async function loadMachineTimeline(){
    setMachineTimelineLoading(true);
    try{
      const qs=[];
      if(dateFrom) qs.push('date_from='+encodeURIComponent(dateFrom));
      if(dateTo) qs.push('date_to='+encodeURIComponent(dateTo));
      if(selectedAssetIds.length>0) qs.push('asset_ids='+encodeURIComponent(selectedAssetIds.join(',')));
      setMachineTimeline(await api('/analysis/by-machine-timeline'+(qs.length?'?'+qs.join('&'):'')));
    }catch(e){toast(e.message,'err');}finally{setMachineTimelineLoading(false);}
  }
  async function loadUptime(){
    try{
      const qs=['hours_per_day='+(parseFloat(hoursPerDay)||19)];
      if(locationFilter) qs.push('location='+encodeURIComponent(locationFilter));
      setUptime(await api('/analysis/uptime?'+qs.join('&')));
    }catch(e){}
  }
  function toggleAssetSelect(id){
    setSelectedAssetIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  }

  async function load(){
    setLoading(true);
    try{
      let url='/work-orders/?limit=300';
      if(statusFilter) url+='&status='+statusFilter;
      const data=await api(url);
      setWos(data.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)));
    }catch(e){toast(e.message,'err');}finally{setLoading(false);}
  }
  async function loadAnalysis(){
    setAnalysisLoading(true);
    try{
      const qs=[];
      if(dateFrom) qs.push('date_from='+encodeURIComponent(dateFrom));
      if(dateTo) qs.push('date_to='+encodeURIComponent(dateTo));
      if(locationFilter) qs.push('location='+encodeURIComponent(locationFilter));
      setAnalysis(await api('/analysis/work-orders'+(qs.length?'?'+qs.join('&'):'')));
    }catch(e){toast(e.message,'err');}finally{setAnalysisLoading(false);}
  }
  async function loadLocations(){
    try{setLocations(await api('/analysis/locations'));}catch(e){}
  }
  useEffect(()=>{load();},[statusFilter]);
  useEffect(()=>{loadAnalysis();},[dateFrom,dateTo,locationFilter]);
  useEffect(()=>{const t=setInterval(loadAnalysis,30000);return()=>clearInterval(t);},[dateFrom,dateTo,locationFilter]);
  useEffect(()=>{loadLocations();loadAssetsList();},[]);
  useEffect(()=>{loadMachineTimeline();},[dateFrom,dateTo,selectedAssetIds]);
  useEffect(()=>{loadUptime();},[hoursPerDay,locationFilter]);
  useEffect(()=>{const t=setInterval(loadUptime,60000);return()=>clearInterval(t);},[hoursPerDay,locationFilter]); // refresh uptime every 60s
  useWS('work_orders',()=>{load();loadAnalysis();loadMachineTimeline();loadUptime();});

  // Extract all embedded base64 photos from description
  // Handles both [OPERATOR_PHOTOS] and [COMPLETION_PHOTOS] sections
  function extractPhotos(wo, key){
    const desc=wo.description||'';
    const photos=[];
    const re=/\[PHOTO:([^\|]+)\|([^\]]+)\]/g;
    let m;
    while((m=re.exec(desc))!==null){
      if(m[2]!=='TOO_LARGE') photos.push(m[2]);
    }
    return photos;
  }

  const allPhotos = wo => extractPhotos(wo, 'all');

  const filtered = wos.filter(w=>{
    const s=search.toLowerCase();
    const matchText = !s || w.wo_number.toLowerCase().includes(s) || w.title.toLowerCase().includes(s) || (w.asset?.name||'').toLowerCase().includes(s) || (w.description||'').toLowerCase().includes(s);
    const matchFrom = !dateFrom || toUTC(w.created_at) >= new Date(dateFrom);
    const matchTo   = !dateTo   || toUTC(w.created_at) <= new Date(dateTo+'T23:59:59');
    return matchText && matchFrom && matchTo;
  });

  function parseField(desc, field){
    for(const line of (desc||'').split('\n')){
      if(line.trim().startsWith(field)){
        const parts=line.split(':',2);
        if(parts[1]) return parts[1].trim();
      }
    }
    return '—';
  }

  function openEdit(wo){
    setEditing(wo);
    setEditForm({
      title:            wo.title||'',
      priority:         wo.priority||'medium',
      status:           wo.status||'completed',
      actual_hours:     wo.actual_hours!=null?wo.actual_hours:'',
      affected_downtime:wo.affected_downtime!==false,
      completed_at:     wo.completed_at?wo.completed_at.slice(0,16):'',
      description:      wo.description||'',
    });
  }

  async function saveEdit(){
    if(!editing) return;
    setSaving(true);
    try{
      const body={};
      if(editForm.title)      body.title=editForm.title;
      if(editForm.priority)   body.priority=editForm.priority;
      if(editForm.status)     body.status=editForm.status;
      body.affected_downtime=editForm.affected_downtime;
      if(editForm.actual_hours!=='') body.actual_hours=parseFloat(editForm.actual_hours);
      if(editForm.completed_at)      body.completed_at=new Date(editForm.completed_at).toISOString();
      if(editForm.description)       body.description=editForm.description;
      await api('/work-orders/'+editing.id,{method:'PATCH',body:JSON.stringify(body)});
      toast('Work order updated ✅');
      setEditing(null);
      load();loadAnalysis();
    }catch(e){toast(e.message,'err');}
    finally{setSaving(false);}
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div><h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>History Log</h1><p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>Complete record of all work orders</p></div>
        <button className="btn btn-secondary" style={{fontSize:'13px'}} onClick={()=>{
          const qs=[]
          if(statusFilter) qs.push('status='+statusFilter);
          if(dateFrom) qs.push('date_from='+dateFrom);
          if(dateTo)   qs.push('date_to='+dateTo);
          downloadFile('/data/export/history.xlsx'+(qs.length?'?'+qs.join('&'):''),'WO_History.xlsx');
        }}>📊 Export Excel</button>
      </div>

      {/* Filters */}
      <div style={{background:'#fff',borderRadius:'12px',padding:'16px',border:'1px solid #f1f5f9',marginBottom:'16px',display:'flex',gap:'12px',flexWrap:'wrap',alignItems:'flex-end'}}>
        <div style={{flex:'1',minWidth:'160px'}}>
          <label className="lbl">Search</label>
          <input className="inp" placeholder="WO#, machine, description…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <div style={{minWidth:'130px'}}>
          <label className="lbl">Status</label>
          <select className="inp" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="">All statuses</option>
            <option value="completed">Completed</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div style={{minWidth:'130px'}}>
          <label className="lbl">From Date</label>
          <input type="date" className="inp" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}/>
        </div>
        <div style={{minWidth:'130px'}}>
          <label className="lbl">To Date</label>
          <input type="date" className="inp" value={dateTo} onChange={e=>setDateTo(e.target.value)}/>
        </div>
        <div style={{minWidth:'180px'}}>
          <label className="lbl">Location</label>
          <select className="inp" value={locationFilter} onChange={e=>setLocationFilter(e.target.value)}>
            <option value="">All locations</option>
            {locations.map(x=><option key={x.location} value={x.location}>{x.location}</option>)}
          </select>
        </div>
        <button className="btn btn-primary" onClick={load}>🔄 Refresh</button>
      </div>

      {/* ── Analysis Tabs ── */}
      <div style={{display:'flex',gap:'8px',marginBottom:'16px',flexWrap:'wrap'}}>
        {[
          ['uptime','📈 Production Line Uptime'],
          ['downtime','📊 Downtime Analysis'],
          ['by_machine','🏭 Downtime by Machine'],
        ].map(([k,l])=>(
          <button key={k} onClick={()=>setAnalysisTab(k)} style={{
            padding:'9px 20px',borderRadius:'8px',border:'none',cursor:'pointer',
            fontSize:'13px',fontWeight:700,
            background:analysisTab===k?'#1e293b':'#f1f5f9',
            color:analysisTab===k?'#fff':'#64748b',
          }}>{l}</button>
        ))}
      </div>

      {/* ── Real-time Production Line Uptime ── */}
      {analysisTab==='uptime'&&!uptime&&(
        <div className="card" style={{marginBottom:'16px'}}><Spinner/></div>
      )}
      {analysisTab==='uptime'&&uptime&&(()=>{
        const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
        const pct=uptime.uptime_pct;
        const color=pct>=95?'#16a34a':pct>=85?'#d97706':'#dc2626';
        const bg=pct>=95?'#f0fdf4':pct>=85?'#fffbeb':'#fef2f2';
        return (
          <div className="card" style={{marginBottom:'16px',background:bg,border:'1px solid '+color+'33'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'16px'}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                  <div style={{fontSize:'16px',fontWeight:800,color:'#1e293b'}}>Production Line Uptime</div>
                  {uptime.is_current_month&&<span className="new-pulse" style={{background:'#dcfce7',color:'#16a34a',padding:'2px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:700}}>● LIVE</span>}
                </div>
                <div style={{fontSize:'12px',color:'#64748b',marginTop:'2px'}}>
                  {MONTH_NAMES[uptime.month-1]} {uptime.year} · {uptime.location?('Line: '+uptime.location):'All locations'} · Affected downtime only
                </div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:'42px',fontWeight:900,color,lineHeight:1}}>{pct}%</div>
                <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'2px'}}>Uptime this month</div>
              </div>
            </div>

            {/* Editable hours/day + location-aware note */}
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginTop:'12px',flexWrap:'wrap'}}>
              <label style={{fontSize:'12px',color:'#475569',fontWeight:600,display:'flex',alignItems:'center',gap:'6px'}}>
                Operating hours/day:
                <input
                  type="number" min="1" max="24" step="0.5"
                  value={hoursPerDay}
                  onChange={e=>setHoursPerDay(e.target.value)}
                  style={{width:'70px',padding:'4px 8px',borderRadius:'6px',border:'1px solid #cbd5e1',fontSize:'13px',fontWeight:700,textAlign:'center'}}
                />
                h
              </label>
              {locationFilter&&<span style={{fontSize:'11px',background:'#eff6ff',color:'#2563eb',padding:'3px 10px',borderRadius:'999px',fontWeight:600}}>📍 Scoped to: {locationFilter}</span>}
              {!locationFilter&&<span style={{fontSize:'11px',color:'#94a3b8'}}>💡 Use the Location filter above to scope uptime to a specific production line</span>}
            </div>

            <div style={{marginTop:'14px',height:'10px',borderRadius:'999px',background:'#e2e8f0',overflow:'hidden'}}>
              <div style={{height:'100%',width:pct+'%',background:color,borderRadius:'999px',transition:'width .4s ease'}}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,minmax(0,1fr))',gap:'10px',marginTop:'14px'}}>
              <div style={{textAlign:'center',background:'rgba(255,255,255,.6)',borderRadius:'8px',padding:'8px'}}>
                <div style={{fontSize:'15px',fontWeight:700,color:'#1e293b'}}>{uptime.days_in_month} days</div>
                <div style={{fontSize:'11px',color:'#94a3b8'}}>Days in Month</div>
              </div>
              <div style={{textAlign:'center',background:'rgba(255,255,255,.6)',borderRadius:'8px',padding:'8px'}}>
                <div style={{fontSize:'15px',fontWeight:700,color:'#1e293b'}}>{uptime.total_available_hours}h</div>
                <div style={{fontSize:'11px',color:'#94a3b8'}}>Total Available Hrs</div>
              </div>
              <div style={{textAlign:'center',background:'rgba(255,255,255,.6)',borderRadius:'8px',padding:'8px'}}>
                <div style={{fontSize:'15px',fontWeight:700,color:'#dc2626'}}>{uptime.affected_downtime_hours}h</div>
                <div style={{fontSize:'11px',color:'#94a3b8'}}>Affected Downtime</div>
              </div>
            </div>
          </div>
        );
      })()}

      {analysisTab==='downtime'&&(
      <div className="card" style={{marginBottom:'16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'12px',marginBottom:'14px'}}>
          <div>
            <div style={{fontSize:'16px',fontWeight:800,color:'#1e293b'}}>Downtime Analysis</div>
            <div style={{fontSize:'12px',color:'#64748b',marginTop:'2px'}}>Affected vs non-affected downtime for the selected date range and location</div>
          </div>
          <span style={{background:'#f0fdf4',color:'#16a34a',border:'1px solid #bbf7d0',padding:'5px 12px',borderRadius:'999px',fontSize:'12px',fontWeight:700}}>Live</span>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:'12px',marginBottom:'16px'}}>
          {[
            ['Affected Hrs',analysis?.summary?.affected_downtime_hrs??0,'#fee2e2','#991b1b'],
            ['Non-Affected Hrs',analysis?.summary?.non_affected_downtime_hrs??0,'#dcfce7','#166534'],
            ['Total Cases',analysis?.summary?.total_cases??0,'#dbeafe','#1e40af'],
            ['Avg Downtime',(analysis?.summary?.avg_downtime_hrs??0)+'h','#ede9fe','#5b21b6'],
          ].map(([label,value,bg,color])=>(
            <div key={label} style={{background:bg,borderRadius:'10px',padding:'12px'}}>
              <div style={{fontSize:'20px',fontWeight:800,color}}>{value}</div>
              <div style={{fontSize:'12px',color:'#475569',marginTop:'2px'}}>{label}</div>
            </div>
          ))}
        </div>

        {analysisLoading?<Spinner/>:(analysis?.downtime_graph||[]).length===0?<Empty msg="No downtime data for selected filters"/>:(
          <RC.ResponsiveContainer width="100%" height={260}>
            <RC.BarChart data={analysis.downtime_graph}>
              <RC.CartesianGrid strokeDasharray="3 3" vertical={false}/>
              <RC.XAxis dataKey="date" tick={{fontSize:12}}/>
              <RC.YAxis tick={{fontSize:12}}/>
              <RC.Tooltip formatter={(v)=>v+'h'}/>
              <RC.Legend/>
              <RC.Bar dataKey="affected_downtime" name="Affected" stackId="downtime" fill="#ef4444"/>
              <RC.Bar dataKey="non_affected_downtime" name="Non-affected" stackId="downtime" fill="#10b981"/>
            </RC.BarChart>
          </RC.ResponsiveContainer>
        )}
      </div>
      )}

      {/* ── Downtime by Machine comparison ── */}
      {analysisTab==='by_machine'&&(
      <div className="card" style={{marginBottom:'16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'12px',marginBottom:'14px',flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:'16px',fontWeight:800,color:'#1e293b'}}>Downtime by Machine</div>
            <div style={{fontSize:'12px',color:'#64748b',marginTop:'2px'}}>Select machines from the dropdown to compare their downtime over the chosen date range</div>
          </div>
        </div>

        {/* Machine multi-select dropdown */}
        <div style={{marginBottom:'16px'}}>
          <MultiSelectDropdown
            options={allAssets}
            selectedIds={selectedAssetIds}
            onToggle={toggleAssetSelect}
            onClear={()=>setSelectedAssetIds([])}
            colors={MACHINE_COLORS}
            placeholder="Select machines to compare…"
          />
        </div>

        {selectedAssetIds.length===0?(
          <Empty msg="Select one or more machines above to compare their downtime"/>
        ):machineTimelineLoading?<Spinner/>:(machineTimeline?.chart_data||[]).length===0?(
          <Empty msg="No downtime data for the selected machines and date range"/>
        ):(
          <RC.ResponsiveContainer width="100%" height={320}>
            <RC.BarChart data={machineTimeline.chart_data}>
              <RC.CartesianGrid strokeDasharray="3 3" vertical={false}/>
              <RC.XAxis dataKey="date" tick={{fontSize:12}}/>
              <RC.YAxis tick={{fontSize:12}} label={{value:'Downtime (hrs)',angle:-90,position:'insideLeft',fontSize:11,fill:'#94a3b8'}}/>
              <RC.Tooltip formatter={(v)=>v+'h'}/>
              <RC.Legend/>
              {machineTimeline.machines.map((m,i)=>(
                <RC.Bar key={m} dataKey={m} name={m}
                  fill={MACHINE_COLORS[allAssets.findIndex(x=>x.name===m)%MACHINE_COLORS.length] || MACHINE_COLORS[i%MACHINE_COLORS.length]}
                  radius={[3,3,0,0]}
                />
              ))}
            </RC.BarChart>
          </RC.ResponsiveContainer>
        )}
      </div>
      )}

      <div style={{fontSize:'12px',color:'#94a3b8',marginBottom:'10px'}}>{filtered.length} records found</div>

      {loading?<Spinner/>:filtered.length===0?<Empty msg="No records found"/>:(
        <div className="card" style={{padding:0}}>
          <div className="ovf"><table>
            <thead><tr>
              {['WO #','Machine','Category / Title','Operator','Status','Root Cause','Downtime Type','Downtime','Request Date','Completed','Photos','Details'].map(h=><th key={h}>{h}</th>)}
            </tr></thead>
            <tbody>{filtered.map(w=>{
              const isReq=w.title.startsWith('[Request]');
              const operator=parseField(w.description,'Submitted by');
              const category=parseField(w.description,'Category');
              const rootCause=parseField(w.description,'Root cause');
              const actualHrs=w.actual_hours?w.actual_hours+'h':calcDowntime(w.created_at,w.completed_at).display;
              const photos=allPhotos(w);
              return (
                <tr key={w.id} className={w.status==='completed'?'history-row-completed':w.status==='open'?'history-row-open':''}>
                  <td><span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px',fontWeight:700}}>{w.wo_number}</span></td>
                  <td style={{fontWeight:600,whiteSpace:'nowrap'}}>{w.asset?.name||'—'}</td>
                  <td style={{maxWidth:'180px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={w.title}>{isReq?(category||'—'):w.title}</td>
                  <td style={{color:'#64748b',fontSize:'12px'}}>{operator||'—'}</td>
                  <td><Badge value={w.status}/></td>
                  <td style={{color:'#64748b',fontSize:'12px',maxWidth:'120px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={rootCause}>{rootCause}</td>
                  <td><Badge value={w.affected_downtime===false?'non_affected':'affected'}/></td>
                  <td style={{fontWeight:600,color:'#b45309'}}>{actualHrs}</td>
                  <td style={{color:'#64748b',fontSize:'12px',whiteSpace:'nowrap'}}>{fmtDate(w.created_at)}</td>
                  <td style={{color:'#64748b',fontSize:'12px',whiteSpace:'nowrap'}}>{w.completed_at?fmtDate(w.completed_at):'—'}</td>
                  <td>
                    {photos.length>0
                      ?<button className="btn btn-secondary" style={{fontSize:'11px',padding:'3px 8px'}} onClick={()=>setSelected({...w,_photos:photos})}>📷 {photos.length}</button>
                      :<span style={{color:'#cbd5e1',fontSize:'12px'}}>—</span>}
                  </td>
                  <td>
                    <div style={{display:'flex',gap:'4px'}}>
                      <button className="btn btn-secondary" style={{fontSize:'11px',padding:'3px 8px'}} onClick={()=>setSelected({...w,_photos:photos})}>View</button>
                      {isAdmin&&<button className="btn btn-primary" style={{fontSize:'11px',padding:'3px 8px'}} onClick={()=>openEdit(w)}>✏️ Edit</button>}
                    </div>
                  </td>
                </tr>
              );
            })}</tbody>
          </table></div>
        </div>
      )}

      {/* Detail modal */}
      {selected&&(
        <Modal title={selected.wo_number+' — '+( selected.asset?.name||'—')} onClose={()=>setSelected(null)} large>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px'}}>
            <div>
              <div className="section-title">Work Order Details</div>
              <div style={{background:'#f8fafc',borderRadius:'10px',padding:'14px',fontSize:'13px',lineHeight:1.8,marginBottom:'12px'}}>
                <div><strong>WO Number:</strong> {selected.wo_number}</div>
                <div><strong>Machine:</strong> {selected.asset?.name||'—'} ({selected.asset?.asset_code||'—'})</div>
                <div><strong>Status:</strong> <Badge value={selected.status}/></div>
                <div><strong>Priority:</strong> <Badge value={selected.priority}/></div>
                <div><strong>Type:</strong> <Badge value={selected.type}/></div>
                <div><strong>Downtime Type:</strong> <Badge value={selected.affected_downtime===false?'non_affected':'affected'}/></div>
                <div><strong>Request Date:</strong> {fmtDT(selected.created_at)}</div>
                <div><strong>Completed:</strong> {selected.completed_at?fmtDT(selected.completed_at):'Not completed'}</div>
                <div><strong>Actual Hours:</strong> {selected.actual_hours?selected.actual_hours+'h':calcDowntime(selected.created_at,selected.completed_at).display}</div>
              </div>
              <div className="section-title">Full Description</div>
              <div style={{background:'#f8fafc',borderRadius:'10px',padding:'14px',fontSize:'13px',color:'#374151',whiteSpace:'pre-line',lineHeight:1.7}}>
                {selected.description||'No description'}
              </div>
            </div>
            <div>
              <div className="section-title">Photos</div>
              {selected._photos&&selected._photos.length>0
                ?<PhotoViewer photos={selected._photos}/>
                :<Empty msg="No photos attached"/>}
            </div>
          </div>
        </Modal>
      )}

      {/* ── Edit Modal (admin only) ── */}
      {editing&&(
