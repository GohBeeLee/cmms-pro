                  />
                  <button className="btn btn-primary" onClick={()=>lookupBarcode()} disabled={scanning||!barcode.trim()} style={{whiteSpace:'nowrap',minWidth:'80px'}}>
                    {scanning?'…':'🔍 Find'}
                  </button>
                </div>
                <button
                  onClick={cameraOpen?stopCamera:startCamera}
                  style={{
                    width:'100%',padding:'11px',fontSize:'14px',fontWeight:700,borderRadius:'8px',cursor:'pointer',
                    border:cameraOpen?'2px solid #dc2626':'2px solid #2563eb',
                    background:cameraOpen?'#fef2f2':'#eff6ff',
                    color:cameraOpen?'#dc2626':'#2563eb',
                    marginBottom:'8px',
                  }}
                >
                  {cameraOpen?'✕ Stop Camera':'📷 Scan with Phone Camera'}
                </button>

                {cameraOpen&&(
                  <div style={{marginBottom:'8px'}}>
                    <div id="camera-view" style={{width:'100%',borderRadius:'10px',overflow:'hidden',background:'#000',minHeight:'220px'}}/>
                    {cameraStarting&&(
                      <div style={{textAlign:'center',padding:'10px',fontSize:'12px',color:'#64748b'}}>Starting camera…</div>
                    )}
                    {cameraError&&(
                      <div style={{marginTop:'8px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'8px',padding:'10px',fontSize:'12px',color:'#991b1b'}}>
                        ⚠️ {cameraError}
                      </div>
                    )}
                    {!cameraError&&!cameraStarting&&(
                      <div style={{marginTop:'6px',fontSize:'11px',color:'#64748b',lineHeight:1.6}}>
                        📐 Fill the box with the barcode, hold steady ~15-20cm away, in good light.<br/>
                        Having trouble? Type the part No / barcode digits manually below instead.
                      </div>
                    )}
                  </div>
                )}

                <div style={{fontSize:'12px',color:'#94a3b8'}}>💡 Use a Bluetooth/USB scanner (auto-fills above), tap the camera button, or type the part No and press Enter.</div>
              </div>

              {scanPart&&(
                <div className="card" style={{padding:'16px'}}>
                  <div className="section-title" style={{marginBottom:'12px'}}>
                    {mode==='out'?'📤 Stock Out Details':'📥 Stock In Details'}
                  </div>
                  <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
                    <div>
                      <label className="lbl">Quantity *</label>
                      <input
                        id="qty-input" type="number" min={1}
                        max={mode==='out'?scanPart.quantity_on_hand:9999}
                        className="inp" style={{fontSize:'20px',fontWeight:700,textAlign:'center'}}
                        value={qty} onChange={e=>setQty(parseInt(e.target.value)||1)}
                        onKeyDown={e=>e.key==='Enter'&&submitMove()}
                      />
                      {mode==='out'&&<div style={{fontSize:'12px',color:'#64748b',marginTop:'4px'}}>
                        Available: <strong>{scanPart.quantity_on_hand}</strong> {scanPart.unit||'pcs'}
                      </div>}
                    </div>
                    <div>
                      <label className="lbl">Reason <small style={{fontWeight:400,color:'#94a3b8'}}>(optional)</small></label>
                      <select className="inp" value={reason} onChange={e=>setReason(e.target.value)}>
                        <option value="">Select reason…</option>
                        {mode==='out'
                          ?['Used for repair','Preventive maintenance','Machine breakdown','Testing','Others'].map(r=><option key={r} value={r}>{r}</option>)
                          :['Purchase received','Returned unused','Stock adjustment','Transfer in','Others'].map(r=><option key={r} value={r}>{r}</option>)
                        }
                      </select>
                    </div>
                    <div>
                      <label className="lbl">Reference <small style={{fontWeight:400,color:'#94a3b8'}}>(WO No / PO No)</small></label>
                      <input className="inp" placeholder="e.g. WO-202506-0012" value={reference} onChange={e=>setReference(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submitMove()}/>
                    </div>
                    <button
                      style={{padding:'13px',fontSize:'15px',fontWeight:700,border:'none',borderRadius:'8px',cursor:'pointer',background:mode==='out'?'#d97706':'#16a34a',color:'#fff'}}
                      onClick={submitMove}
                    >
                      {mode==='out'?`📤 Confirm Stock Out (−${qty})`:`📥 Confirm Stock In (+${qty})`}
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* Right: part card + result */}
            <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
              {scanning&&<div className="card" style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'50px'}}><Spinner/></div>}
              {scanPart&&!scanning&&(
                <div className="card" style={{border:scanPart.is_low_stock?'2px solid #f59e0b':'2px solid #e2e8f0',background:scanPart.is_low_stock?'#fefce8':'#fff'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'12px',gap:'12px'}}>
                    {scanPart.photo_url&&(
                      <img src={scanPart.photo_url} alt={scanPart.name} onClick={()=>setLightboxPhoto({url:scanPart.photo_url,name:scanPart.name})}
                        style={{width:'64px',height:'64px',objectFit:'cover',borderRadius:'10px',border:'1px solid #e2e8f0',flexShrink:0,cursor:'zoom-in'}}/>
                    )}
                    <div style={{flex:1}}>
                      <div style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px',fontWeight:700,marginBottom:'4px'}}>{scanPart.part_code}</div>
                      <div style={{fontWeight:800,color:'#1e293b',fontSize:'16px',marginBottom:'4px'}}>{scanPart.name}</div>
                      <div style={{fontSize:'12px',color:'#64748b'}}>{scanPart.category}{scanPart.description&&' · '+scanPart.description}</div>
                    </div>
                    <span style={{padding:'4px 12px',borderRadius:'999px',fontSize:'11px',fontWeight:700,flexShrink:0,background:scanPart.is_low_stock?'#fef9c3':'#dcfce7',color:scanPart.is_low_stock?'#854d0e':'#166534'}}>{scanPart.status}</span>
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'10px',background:'#f8fafc',borderRadius:'10px',padding:'12px',marginBottom:'12px'}}>
                    <div style={{textAlign:'center'}}>
                      <div style={{fontSize:'24px',fontWeight:800,color:scanPart.is_low_stock?'#ea580c':'#2563eb'}}>{scanPart.quantity_on_hand}</div>
                      <div style={{fontSize:'11px',color:'#94a3b8'}}>Current Stock</div>
                    </div>
                    <div style={{textAlign:'center',borderLeft:'1px solid #e2e8f0',borderRight:'1px solid #e2e8f0'}}>
                      <div style={{fontSize:'24px',fontWeight:800,color:'#64748b'}}>{scanPart.reorder_level}</div>
                      <div style={{fontSize:'11px',color:'#94a3b8'}}>Min Level</div>
                    </div>
                    <div style={{textAlign:'center'}}>
                      <div style={{fontSize:'16px',fontWeight:700,color:'#374151'}}>{scanPart.unit||'pcs'}</div>
                      <div style={{fontSize:'11px',color:'#94a3b8'}}>Unit</div>
                    </div>
                  </div>
                  <div style={{fontSize:'12px',color:'#374151',lineHeight:1.9}}>
                    {scanPart.location&&<div>📍 <strong>Location:</strong> {scanPart.location}</div>}
                    {scanPart.used_on_asset&&<div>🏭 <strong>Used on:</strong> {scanPart.used_on_asset}</div>}
                    {canManage&&scanPart.unit_cost!=null&&<div>💰 <strong>Unit Price:</strong> RM {scanPart.unit_cost.toFixed(2)}</div>}
                    {scanPart.barcode&&<div>🔲 <strong>Barcode:</strong> <span style={{fontFamily:'monospace'}}>{scanPart.barcode}</span></div>}
                  </div>
                  {scanPart.is_low_stock&&(
                    <div style={{marginTop:'10px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'8px',padding:'8px 12px',fontSize:'12px',color:'#991b1b',fontWeight:600}}>
                      ⚠️ Low stock — below minimum level!
                    </div>
                  )}
                </div>
              )}
              {moveResult&&(
                <div style={{background:moveResult.low_stock?'#fef2f2':mode==='out'?'#fefce8':'#f0fdf4',border:`2px solid ${moveResult.low_stock?'#fca5a5':mode==='out'?'#fde68a':'#bbf7d0'}`,borderRadius:'12px',padding:'14px'}}>
                  <div style={{fontWeight:700,fontSize:'14px',marginBottom:'8px',color:moveResult.low_stock?'#991b1b':mode==='out'?'#b45309':'#16a34a'}}>
                    {mode==='out'?'📤 Stock Out Complete':'📥 Stock In Complete'}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px'}}>
                    {[
                      {label:'Before',value:moveResult.qty_before},
                      {label:mode==='out'?'Removed':'Added',value:(mode==='out'?'−':'+')+(moveResult.qty_after!==undefined?Math.abs(moveResult.qty_after-moveResult.qty_before):0)},
                      {label:'After', value:moveResult.qty_after},
                    ].map((s,i)=>(
                      <div key={i} style={{textAlign:'center',background:'rgba(255,255,255,0.7)',borderRadius:'8px',padding:'8px'}}>
                        <div style={{fontSize:'20px',fontWeight:800,color:'#1e293b'}}>{s.value}</div>
                        <div style={{fontSize:'11px',color:'#64748b'}}>{s.label}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Stock Take (physical count via barcode scan) ────────────────────────────
function StockTakeTab(){
  const [barcode,setBarcode]=useState('');
  const [scanning,setScanning]=useState(false);
  const [scanPart,setScanPart]=useState(null);
  const [editForm,setEditForm]=useState(null); // editable copy of scanned part
  const [saving,setSaving]=useState(false);
  const [lastResult,setLastResult]=useState(null);
  const [sessionLog,setSessionLog]=useState([]); // items checked this session (client-side only)
  const barcodeRef=useRef(null);
  // Camera
  const [cameraOpen,setCameraOpen]=useState(false);
  const [cameraError,setCameraError]=useState('');
  const [cameraStarting,setCameraStarting]=useState(false);
  const html5QrRef=useRef(null);
  const cameraStartedRef=useRef(false);
  // Coverage status — "what have I missed"
  const [coverage,setCoverage]=useState(null);
  const [coverageLoading,setCoverageLoading]=useState(true);
  const [coverageView,setCoverageView]=useState('never'); // 'never' | 'stale' | 'done'
  const [showCoverage,setShowCoverage]=useState(true);

  async function loadCoverage(){
    setCoverageLoading(true);
    try{ setCoverage(await api('/inventory/stock-take-status?stale_after_days=30')); }
    catch(e){ /* silent — non-critical panel */ }
    finally{ setCoverageLoading(false); }
  }
  useEffect(()=>{ loadCoverage(); },[]);
  useWS('inventory',loadCoverage);

  useEffect(()=>{ barcodeRef.current?.focus(); },[]);
  useEffect(()=>{
    return ()=>{
      if(html5QrRef.current&&cameraStartedRef.current){
        html5QrRef.current.stop().then(()=>html5QrRef.current.clear()).catch(()=>{});
      }
    };
  },[]);

  async function lookupBarcode(code){
    const b=(code||barcode).trim();
    if(!b) return;
    setScanning(true);setScanPart(null);setEditForm(null);setLastResult(null);
    try{
      const data=await api('/stock/scan/'+encodeURIComponent(b));
      setScanPart(data);
      setEditForm({
        quantity_on_hand:data.quantity_on_hand,
        name:data.name,category:data.category||'',
        description:data.description||'',location:data.location||'',
        used_on_asset:data.used_on_asset||'',
        unit_cost:data.unit_cost!=null?data.unit_cost:'',
        reorder_level:data.reorder_level,
      });
    }catch(e){toast(e.message,'err');setScanPart(null);}
    finally{setScanning(false);}
  }
  function onBarcodeKey(e){ if(e.key==='Enter'){e.preventDefault();lookupBarcode();} }

  async function startCamera(){
    if(typeof Html5Qrcode==='undefined'){
      setCameraError('Camera scanner library failed to load. Check your internet connection.');
      return;
    }
    setCameraOpen(true);setCameraError('');setCameraStarting(true);
    setTimeout(async()=>{
      try{
        if(!html5QrRef.current) html5QrRef.current=new Html5Qrcode('camera-view-stocktake',{
          useBarCodeDetectorIfSupported:true,
          verbose:false,
        });
        const config={
          fps:8,
          qrbox:(vw,vh)=>{
            const w=Math.floor(Math.min(vw,vh)*0.85);
            return {width:w,height:Math.floor(w*0.4)};
          },
          aspectRatio:1.7777778,
          disableFlip:false,
        };
        await html5QrRef.current.start(
          {facingMode:'environment'},
          config,
          (decodedText)=>{ onCameraDetected(decodedText); },
          ()=>{},
        );
        cameraStartedRef.current=true;
      }catch(err){
        setCameraError(
          err && err.toString && err.toString().includes('NotAllowedError')
            ? 'Camera permission denied. Please allow camera access and try again.'
            : 'Could not start camera: '+(err?.message||err)
        );
        cameraStartedRef.current=false;
      }finally{
        setCameraStarting(false);
      }
    },50);
  }
  async function stopCamera(){
    try{
      if(html5QrRef.current&&cameraStartedRef.current){
        await html5QrRef.current.stop();
        html5QrRef.current.clear();
      }
    }catch(e){}
    cameraStartedRef.current=false;
    setCameraOpen(false);setCameraError('');
  }
  function onCameraDetected(decodedText){
    if(!decodedText) return;
    stopCamera();
    setBarcode(decodedText);
    lookupBarcode(decodedText);
  }

  function resetScan(){
    setScanPart(null);setEditForm(null);setBarcode('');setLastResult(null);
    setTimeout(()=>barcodeRef.current?.focus(),100);
  }

  function jumpToPart(entry){
    // Coverage list entries don't carry barcode, but part_code always
    // works as a fallback lookup key in /stock/scan/{code}
    setBarcode(entry.part_code);
    lookupBarcode(entry.part_code);
    window.scrollTo({top:0,behavior:'smooth'});
  }

  async function saveCount(){
    if(!scanPart||!editForm) return;
    setSaving(true);
    try{
      const body={
        part_id:scanPart.id,
        new_quantity:parseInt(editForm.quantity_on_hand)||0,
        name:editForm.name!==scanPart.name?editForm.name:undefined,
        category:editForm.category!==(scanPart.category||'')?editForm.category:undefined,
        description:editForm.description!==(scanPart.description||'')?editForm.description:undefined,
        location:editForm.location!==(scanPart.location||'')?editForm.location:undefined,
        used_on_asset:editForm.used_on_asset!==(scanPart.used_on_asset||'')?editForm.used_on_asset:undefined,
        unit_cost:editForm.unit_cost!==''&&parseFloat(editForm.unit_cost)!==scanPart.unit_cost?parseFloat(editForm.unit_cost):undefined,
        reorder_level:parseInt(editForm.reorder_level)!==scanPart.reorder_level?parseInt(editForm.reorder_level):undefined,
      };
      const result=await api('/stock/adjust',{method:'POST',body:JSON.stringify(body)});
      setLastResult(result);
      toast(result.changed?'✅ Stock take saved':'No changes — already matches');
      setSessionLog(prev=>[{
        part_code:scanPart.part_code,name:scanPart.name,
        qty_before:result.qty_before,qty_after:result.qty_after,
        changed:result.changed,time:new Date(),
      },...prev]);
      loadCoverage();
    }catch(e){toast(e.message,'err');}
    finally{setSaving(false);}
  }

  const qtyChanged = editForm && scanPart && parseInt(editForm.quantity_on_hand)!==scanPart.quantity_on_hand;

  return (
    <div>
      <div style={{background:'#eff6ff',border:'1px solid #bfdbfe',borderRadius:'10px',padding:'12px 16px',marginBottom:'16px',fontSize:'13px',color:'#1e40af'}}>
        📋 <strong>Stock Take:</strong> Scan each item's barcode, compare the displayed quantity/details against what's physically on the shelf, and correct anything that doesn't match. Every correction is recorded in Movement History with reason "[STOCK TAKE]".
      </div>

      {/* ── Coverage summary: what have I missed ── */}
      <div className="card" style={{marginBottom:'16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:showCoverage?'14px':0,cursor:'pointer'}} onClick={()=>setShowCoverage(s=>!s)}>
          <div className="section-title" style={{margin:0}}>📊 Stock Take Coverage</div>
          <span style={{fontSize:'12px',color:'#94a3b8'}}>{showCoverage?'▲ Hide':'▼ Show'}</span>
        </div>

        {showCoverage&&(coverageLoading?<Spinner/>:!coverage?<Empty msg="Could not load coverage status"/>:(
          <div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px',marginBottom:'14px'}}>
              {[
                ['never','Never Checked',coverage.never_checked_count,'#fef2f2','#dc2626'],
                ['stale','Stale (>30 days)',coverage.stale_count,'#fefce8','#b45309'],
                ['done','Up to Date',coverage.up_to_date_count,'#f0fdf4','#16a34a'],
              ].map(([key,label,count,bg,color])=>(
                <div key={key} onClick={()=>setCoverageView(key)} style={{
                  cursor:'pointer',textAlign:'center',padding:'14px',borderRadius:'10px',background:bg,
                  border:coverageView===key?'2px solid '+color:'2px solid transparent',
                }}>
                  <div style={{fontSize:'26px',fontWeight:800,color}}>{count}</div>
                  <div style={{fontSize:'12px',color:'#475569',fontWeight:600,marginTop:'2px'}}>{label}</div>
                </div>
              ))}
            </div>

            <div style={{fontSize:'12px',color:'#94a3b8',marginBottom:'8px'}}>
              {coverage.total_parts} parts total · click a card above to view that list · click any item below to scan it directly
            </div>

            <div style={{maxHeight:'220px',overflowY:'auto',border:'1px solid #f1f5f9',borderRadius:'8px'}}>
              {(coverage[coverageView==='never'?'never_checked':coverageView==='stale'?'stale':'up_to_date']||[]).length===0?(
                <div style={{padding:'20px',textAlign:'center',color:'#94a3b8',fontSize:'13px'}}>
                  {coverageView==='never'?'🎉 Everything has been checked at least once!':
                   coverageView==='stale'?'🎉 Nothing is overdue!':
                   'No items checked yet.'}
                </div>
              ):(coverage[coverageView==='never'?'never_checked':coverageView==='stale'?'stale':'up_to_date']).map(entry=>(
                <div key={entry.id} onClick={()=>jumpToPart(entry)} style={{
                  display:'flex',justifyContent:'space-between',alignItems:'center',
                  padding:'10px 14px',borderBottom:'1px solid #f8fafc',cursor:'pointer',
                }}
                onMouseEnter={e=>e.currentTarget.style.background='#f8fafc'}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}
                >
                  <div>
                    <span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px',marginRight:'8px'}}>{entry.part_code}</span>
                    <span style={{fontWeight:600,fontSize:'13px'}}>{entry.name}</span>
                    {entry.location&&<span style={{fontSize:'11px',color:'#94a3b8',marginLeft:'8px'}}>📍 {entry.location}</span>}
                  </div>
                  <div style={{textAlign:'right',fontSize:'12px'}}>
                    <div style={{color:entry.days_since==null?'#dc2626':entry.days_since>30?'#b45309':'#16a34a',fontWeight:600}}>
                      {relativeTime(entry.last_stock_take_at)}
                    </div>
                    {entry.last_stock_take_by&&<div style={{color:'#94a3b8',fontSize:'11px'}}>by {entry.last_stock_take_by}</div>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:(scanPart||scanning)?'1fr 1fr':'1fr',gap:'20px'}}>
        {/* Left: scan input */}
        <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
          <div className="card" style={{padding:'16px'}}>
            <div className="section-title" style={{marginBottom:'12px'}}>Scan Item</div>
            <div style={{display:'flex',gap:'8px',marginBottom:'8px'}}>
              <input
                ref={barcodeRef}
                className="inp"
                placeholder="Scan or type barcode / part No…"
                value={barcode}
                onChange={e=>setBarcode(e.target.value)}
                onKeyDown={onBarcodeKey}
                style={{fontSize:'16px',letterSpacing:'1px'}}
                autoComplete="off"
              />
              <button className="btn btn-primary" onClick={()=>lookupBarcode()} disabled={scanning||!barcode.trim()} style={{whiteSpace:'nowrap',minWidth:'80px'}}>
                {scanning?'…':'🔍 Find'}
              </button>
            </div>
            <button
              onClick={cameraOpen?stopCamera:startCamera}
              style={{
                width:'100%',padding:'11px',fontSize:'14px',fontWeight:700,borderRadius:'8px',cursor:'pointer',
                border:cameraOpen?'2px solid #dc2626':'2px solid #2563eb',
                background:cameraOpen?'#fef2f2':'#eff6ff',
                color:cameraOpen?'#dc2626':'#2563eb',
                marginBottom:'8px',
              }}
            >
              {cameraOpen?'✕ Stop Camera':'📷 Scan with Phone Camera'}
            </button>
            {cameraOpen&&(
              <div style={{marginBottom:'8px'}}>
                <div id="camera-view-stocktake" style={{width:'100%',borderRadius:'10px',overflow:'hidden',background:'#000',minHeight:'220px'}}/>
                {cameraStarting&&<div style={{textAlign:'center',padding:'10px',fontSize:'12px',color:'#64748b'}}>Starting camera…</div>}
                {cameraError&&(
                  <div style={{marginTop:'8px',background:'#fef2f2',border:'1px solid #fecaca',borderRadius:'8px',padding:'10px',fontSize:'12px',color:'#991b1b'}}>
                    ⚠️ {cameraError}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Session log — what's been checked so far this sitting */}
          {sessionLog.length>0&&(
            <div className="card" style={{padding:'16px'}}>
              <div className="section-title" style={{marginBottom:'10px'}}>This Session ({sessionLog.length} checked)</div>
              <div style={{display:'flex',flexDirection:'column',gap:'6px',maxHeight:'260px',overflowY:'auto'}}>
                {sessionLog.map((s,i)=>(
                  <div key={i} style={{
                    display:'flex',justifyContent:'space-between',alignItems:'center',
                    padding:'8px 10px',borderRadius:'8px',fontSize:'12px',
                    background:s.changed?'#fefce8':'#f0fdf4',
                  }}>
                    <div>
                      <span style={{fontFamily:'monospace',color:'#2563eb',marginRight:'6px'}}>{s.part_code}</span>
                      <span style={{fontWeight:600}}>{s.name}</span>
                    </div>
                    <span style={{fontWeight:700,color:s.changed?'#b45309':'#16a34a'}}>
                      {s.changed?`${s.qty_before}→${s.qty_after}`:'✓ Matched'}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Right: scanned part details + edit form */}
        <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
          {scanning&&<div className="card" style={{display:'flex',alignItems:'center',justifyContent:'center',padding:'50px'}}><Spinner/></div>}

          {scanPart&&editForm&&!scanning&&(
            <div className="card" style={{border:'2px solid #e2e8f0'}}>
              <div style={{display:'flex',gap:'12px',marginBottom:'14px'}}>
                {scanPart.photo_url&&(
                  <img src={scanPart.photo_url} alt={scanPart.name} style={{width:'56px',height:'56px',objectFit:'cover',borderRadius:'8px',border:'1px solid #e2e8f0',flexShrink:0}}/>
                )}
                <div style={{flex:1}}>
                  <div style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px',fontWeight:700}}>{scanPart.part_code}</div>
                  <div style={{fontWeight:800,fontSize:'15px',color:'#1e293b'}}>{scanPart.name}</div>
                </div>
              </div>

              {/* Quantity comparison — the core of stock take */}
              <div style={{background:qtyChanged?'#fefce8':'#f0fdf4',border:'1px solid '+(qtyChanged?'#fde68a':'#bbf7d0'),borderRadius:'10px',padding:'14px',marginBottom:'14px'}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'10px',alignItems:'center'}}>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:'11px',color:'#94a3b8',marginBottom:'2px'}}>System Qty</div>
                    <div style={{fontSize:'24px',fontWeight:800,color:'#64748b'}}>{scanPart.quantity_on_hand}</div>
                  </div>
                  <div style={{fontSize:'18px',color:'#94a3b8'}}>→</div>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:'11px',color:'#94a3b8',marginBottom:'2px'}}>Actual Count *</div>
                    <input type="number" min="0" value={editForm.quantity_on_hand}
                      onChange={e=>setEditForm({...editForm,quantity_on_hand:e.target.value})}
                      style={{width:'100%',fontSize:'22px',fontWeight:800,textAlign:'center',color:qtyChanged?'#b45309':'#16a34a',border:'2px solid '+(qtyChanged?'#f59e0b':'#86efac'),borderRadius:'8px',padding:'4px'}}
                    />
                  </div>
                </div>
                {qtyChanged&&<div style={{textAlign:'center',fontSize:'12px',color:'#b45309',fontWeight:600,marginTop:'8px'}}>⚠️ Mismatch detected — will be recorded as an adjustment</div>}
              </div>

              {/* Detail corrections */}
              <div className="section-title" style={{marginBottom:'8px',fontSize:'12px'}}>Correct Details (if wrong)</div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'8px'}}>
                <div><label className="lbl">Name</label><input className="inp" value={editForm.name} onChange={e=>setEditForm({...editForm,name:e.target.value})}/></div>
                <div><label className="lbl">Category</label><input className="inp" value={editForm.category} onChange={e=>setEditForm({...editForm,category:e.target.value})}/></div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'8px'}}>
                <div><label className="lbl">Rack No</label><input className="inp" value={editForm.location} onChange={e=>setEditForm({...editForm,location:e.target.value})}/></div>
                <div><label className="lbl">Use at</label><input className="inp" value={editForm.used_on_asset} onChange={e=>setEditForm({...editForm,used_on_asset:e.target.value})}/></div>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'14px'}}>
                <div><label className="lbl">Unit Price (RM)</label><input type="number" step="0.01" className="inp" value={editForm.unit_cost} onChange={e=>setEditForm({...editForm,unit_cost:e.target.value})}/></div>
                <div><label className="lbl">Threshold</label><input type="number" className="inp" value={editForm.reorder_level} onChange={e=>setEditForm({...editForm,reorder_level:e.target.value})}/></div>
              </div>

              <div style={{display:'flex',gap:'8px'}}>
                <button className="btn btn-primary" style={{flex:1}} onClick={saveCount} disabled={saving}>
                  {saving?'Saving…':'💾 Save Count'}
                </button>
                <button className="btn btn-secondary" style={{flex:1}} onClick={resetScan}>Next Item →</button>
              </div>
            </div>
          )}

          {lastResult&&(
            <div style={{background:lastResult.changed?'#fefce8':'#f0fdf4',border:'2px solid '+(lastResult.changed?'#fde68a':'#bbf7d0'),borderRadius:'12px',padding:'14px',fontSize:'13px'}}>
              <div style={{fontWeight:700,color:lastResult.changed?'#b45309':'#16a34a',marginBottom:'4px'}}>
                {lastResult.changed?'✏️ Recorded as adjustment':'✓ No changes needed'}
              </div>
              <div style={{color:'#64748b'}}>{lastResult.message}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Stock Movement History (kept separate) ─────────────────────────────────
function StockHistoryTab(){
  const [history,setHistory]=useState([]);
  const [histLoading,setHistLoading]=useState(false);
  const [histFilter,setHistFilter]=useState('');
  const [histDateFrom,setHistDateFrom]=useState('');
  const [histDateTo,setHistDateTo]=useState('');

  async function loadHistory(){
    setHistLoading(true);
    try{
      let url='/stock/history?limit=200';
      if(histFilter)   url+='&movement='+histFilter;
      if(histDateFrom) url+='&date_from='+histDateFrom;
      if(histDateTo)   url+='&date_to='+histDateTo;
      setHistory(await api(url));
    }catch(e){toast(e.message,'err');}
    finally{setHistLoading(false);}
  }
  useEffect(()=>{loadHistory();},[histFilter,histDateFrom,histDateTo]);
  useWS('inventory',loadHistory);

  function fmtDT(d){
    if(!d) return '—';
    const s=String(d); const dt=toUTC(s.endsWith('Z')||s.includes('+') ? s : s+'Z');
    return dt.toLocaleString('en-MY',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  }

  const moveColor = {
    stock_in: {bg:'#dcfce7',color:'#166534',label:'Stock In',icon:'📥'},
    stock_out:{bg:'#fef9c3',color:'#854d0e',label:'Stock Out',icon:'📤'},
    restock:  {bg:'#dbeafe',color:'#1e40af',label:'Restock',  icon:'🔄'},
    adjustment:{bg:'#f1f5f9',color:'#475569',label:'Adjust',  icon:'⚙️'},
  };

  return (
    <div>
      {/* Filter bar */}
      <div style={{background:'#fff',borderRadius:'12px',padding:'16px',border:'1px solid #f1f5f9',marginBottom:'16px',display:'flex',gap:'12px',flexWrap:'wrap',alignItems:'flex-end'}}>
        <div style={{minWidth:'160px'}}>
          <label className="lbl">Movement Type</label>
          <select className="inp" value={histFilter} onChange={e=>setHistFilter(e.target.value)}>
            <option value="">All movements</option>
            <option value="stock_in">📥 Stock In</option>
            <option value="stock_out">📤 Stock Out</option>
            <option value="restock">🔄 Restock</option>
          </select>
        </div>
        <div style={{minWidth:'140px'}}>
          <label className="lbl">From Date</label>
          <input type="date" className="inp" value={histDateFrom} onChange={e=>setHistDateFrom(e.target.value)}/>
        </div>
        <div style={{minWidth:'140px'}}>
          <label className="lbl">To Date</label>
          <input type="date" className="inp" value={histDateTo} onChange={e=>setHistDateTo(e.target.value)}/>
        </div>
        <button className="btn btn-primary" onClick={loadHistory}>🔍 Search</button>
        <button className="btn btn-secondary" onClick={()=>downloadFile('/stock/history/export.xlsx'+(histFilter?'?movement='+histFilter:''),'StockHistory.xlsx')}>
          📊 Export Excel
        </button>
      </div>

      {/* Summary cards */}
      {history.length>0&&(()=>{
        const inCount  = history.filter(h=>h.movement==='stock_in').length;
        const outCount = history.filter(h=>h.movement==='stock_out').length;
        const inQty    = history.filter(h=>h.movement==='stock_in').reduce((s,h)=>s+(h.quantity||0),0);
        const outQty   = history.filter(h=>h.movement==='stock_out').reduce((s,h)=>s+(h.quantity||0),0);
        return (
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'12px',marginBottom:'16px'}}>
            {[
              {icon:'📋',label:'Total Movements',value:history.length,bg:'#eff6ff',color:'#2563eb'},
              {icon:'📥',label:'Stock In (txn)',value:inCount,bg:'#f0fdf4',color:'#16a34a'},
              {icon:'📤',label:'Stock Out (txn)',value:outCount,bg:'#fefce8',color:'#b45309'},
              {icon:'📦',label:'Net Qty Change',value:(inQty-outQty>=0?'+':''+(inQty-outQty)),bg:'#f5f3ff',color:'#5b21b6'},
            ].map((s,i)=>(
              <div key={i} className="kpi" style={{padding:'14px'}}>
                <div className="kpi-icon" style={{background:s.bg,width:'38px',height:'38px',fontSize:'16px'}}>{s.icon}</div>
                <div>
                  <div style={{fontSize:'22px',fontWeight:800,color:s.color,lineHeight:1}}>{s.value}</div>
                  <div style={{fontSize:'11px',color:'#94a3b8',marginTop:'3px'}}>{s.label}</div>
                </div>
              </div>
            ))}
          </div>
        );
      })()}

      {/* History table */}
      <div className="card" style={{padding:0}}>
        {histLoading?<Spinner/>:history.length===0?<Empty msg="No movements found for selected filters"/>:(
          <div className="ovf"><table>
            <thead><tr>
              {['Date / Time','Part Code','Part Name','Type','Qty','Before','After','Reason','Reference','Performed By'].map(h=><th key={h}>{h}</th>)}
            </tr></thead>
            <tbody>{history.map((h,i)=>{
              const mc=moveColor[h.movement]||{bg:'#f1f5f9',color:'#374151',icon:'⚙️',label:h.movement};
              const sign=h.movement==='stock_out'?'−':'+';
              return (
                <tr key={i}>
                  <td style={{whiteSpace:'nowrap',fontSize:'12px',color:'#64748b'}}>{fmtDT(h.created_at)}</td>
                  <td><span style={{fontFamily:'monospace',color:'#2563eb',fontSize:'12px'}}>{h.part_code}</span></td>
                  <td style={{fontWeight:600}}>{h.part_name}</td>
                  <td>
                    <span style={{background:mc.bg,color:mc.color,padding:'2px 10px',borderRadius:'999px',fontSize:'11px',fontWeight:700,whiteSpace:'nowrap'}}>
                      {mc.icon} {mc.label||h.movement}
                    </span>
                  </td>
                  <td style={{textAlign:'right',fontWeight:700,color:h.movement==='stock_out'?'#ea580c':'#16a34a',fontSize:'14px'}}>
                    {sign}{h.quantity}
                  </td>
                  <td style={{textAlign:'right',color:'#64748b'}}>{h.qty_before}</td>
                  <td style={{textAlign:'right',fontWeight:600,color:'#1e293b'}}>{h.qty_after}</td>
                  <td style={{color:'#64748b',fontSize:'12px'}}>{h.reason||'—'}</td>
                  <td style={{fontFamily:'monospace',fontSize:'12px',color:'#2563eb'}}>{h.reference||'—'}</td>
                  <td style={{color:'#64748b',fontSize:'12px',whiteSpace:'nowrap'}}>{h.performed_by_name}</td>
                </tr>
              );
            })}</tbody>
          </table></div>
        )}
      </div>
    </div>
  );
}


function PMSchedules(){
  const [schedules,setSchedules]=useState([]);
  const [assets,setAssets]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const emptyForm={asset_id:'',title:'',description:'',frequency:'monthly',interval_days:30,estimated_hours:'',next_due:''};
  const [form,setForm]=useState(emptyForm);
  const FREQS=['daily','weekly','monthly','quarterly','biannual','annual','custom'];
  async function load(){try{const [s,a]=await Promise.all([api('/pm-schedules/'),api('/assets/')]);setSchedules(s);setAssets(a);}catch(e){toast(e.message,'err');}finally{setLoading(false);}}
  useEffect(()=>{load();},[]);
  async function create(){
    try{
      const p={...form,interval_days:parseInt(form.interval_days)};
      if(p.next_due) p.next_due=new Date(p.next_due).toISOString();
      if(p.estimated_hours) p.estimated_hours=parseFloat(p.estimated_hours);
      await api('/pm-schedules/',{method:'POST',body:JSON.stringify(p)});
      toast('Created');setModal(false);setForm(emptyForm);load();
    }catch(e){toast(e.message,'err');}
  }
  async function trigger(id){try{await api('/pm-schedules/'+id+'/trigger',{method:'POST'});toast('WO generated!');load();}catch(e){toast(e.message,'err');}}
  async function toggle(pm){try{await api('/pm-schedules/'+pm.id,{method:'PATCH',body:JSON.stringify({is_active:!pm.is_active})});load();}catch(e){toast(e.message,'err');}}
  function fmtDate(d){return d?new Date(d).toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'}):'—';}
  function isOD(d){return d&&toUTC(d)<new Date();}
  function isSoon(d){if(!d)return false;const diff=(toUTC(d)-new Date())/(1000*60*60*24);return diff>=0&&diff<=7;}
  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
        <div><h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>PM Schedules</h1><p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>Preventive maintenance planning</p></div>
        <button className="btn btn-primary" onClick={()=>setModal(true)}>+ New Schedule</button>
      </div>
      <div className="card" style={{padding:0}}>
        {loading?<Spinner/>:schedules.length===0?<Empty msg="No PM schedules"/>:(
          <div className="ovf"><table>
            <thead><tr>{['Title','Asset','Frequency','Next Due','Est. Hours','Status','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
            <tbody>{schedules.map(pm=>{
              const ov=isOD(pm.next_due),soon=isSoon(pm.next_due);
              return(<tr key={pm.id} style={ov?{background:'#fef2f2',borderLeft:'3px solid #ef4444'}:soon?{background:'#fefce8',borderLeft:'3px solid #f59e0b'}:{}}>
                <td style={{fontWeight:600}}>{pm.title}</td>
                <td style={{color:'#64748b',fontSize:'12px'}}>{pm.asset?.name||'—'}</td>
                <td style={{color:'#64748b',textTransform:'capitalize'}}>{pm.frequency}</td>
                <td style={{fontWeight:600,color:ov?'#dc2626':soon?'#d97706':'#1e293b'}}>{fmtDate(pm.next_due)}{ov&&' ⚠️'}</td>
                <td style={{color:'#64748b'}}>{pm.estimated_hours?pm.estimated_hours+'h':'—'}</td>
                <td><Badge value={pm.is_active?'active':'inactive'}/></td>
                <td>
                  <button onClick={()=>trigger(pm.id)} style={{color:'#7c3aed',background:'none',border:'none',cursor:'pointer',fontSize:'13px',marginRight:'10px'}}>⚡ Trigger</button>
                  <button onClick={()=>toggle(pm)} style={{color:'#64748b',background:'none',border:'none',cursor:'pointer',fontSize:'13px'}}>{pm.is_active?'Deactivate':'Activate'}</button>
                </td>
              </tr>);
            })}</tbody>
          </table></div>
        )}
      </div>
      {modal&&(<Modal title="New PM Schedule" onClose={()=>setModal(false)}>
        <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
          <div><label className="lbl">Asset *</label><select className="inp" value={form.asset_id} onChange={e=>setForm({...form,asset_id:e.target.value})}><option value="">Select asset…</option>{assets.map(a=><option key={a.id} value={a.id}>{a.name} ({a.asset_code})</option>)}</select></div>
          <div><label className="lbl">Title *</label><input className="inp" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/></div>
          <div><label className="lbl">Description</label><textarea className="inp" rows={2} value={form.description} onChange={e=>setForm({...form,description:e.target.value})}/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
            <div><label className="lbl">Frequency</label><select className="inp" value={form.frequency} onChange={e=>setForm({...form,frequency:e.target.value})}>{FREQS.map(f=><option key={f} value={f}>{f}</option>)}</select></div>
            <div><label className="lbl">Interval (days)</label><input type="number" className="inp" value={form.interval_days} onChange={e=>setForm({...form,interval_days:e.target.value})}/></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}}>
            <div><label className="lbl">First Due Date *</label><input type="datetime-local" className="inp" value={form.next_due} onChange={e=>setForm({...form,next_due:e.target.value})}/></div>
            <div><label className="lbl">Est. Hours</label><input type="number" className="inp" value={form.estimated_hours} onChange={e=>setForm({...form,estimated_hours:e.target.value})}/></div>
          </div>
          <div style={{display:'flex',gap:'10px',marginTop:'8px'}}>
            <button className="btn btn-primary" style={{flex:1}} onClick={create}>Create Schedule</button>
            <button className="btn btn-secondary" style={{flex:1}} onClick={()=>setModal(false)}>Cancel</button>
          </div>
        </div>
      </Modal>)}
    </div>
  );
}


// ── App Shell ──────────────────────────────────────────────────────────────
function UsersManagement(){
  const {user:me}=useAuth();
  const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [modal,setModal]=useState(false);
  const [editing,setEditing]=useState(null);
  const [saving,setSaving]=useState(false);
  const [toggling,setToggling]=useState(null); // id being toggled
  const [form,setForm]=useState({name:'',email:'',password:'',role:'technician'});

  async function load(){setLoading(true);try{setUsers(await api('/users/'));}catch(e){toast(e.message,'err');}finally{setLoading(false);}}
  useEffect(()=>{load();},[]);
  useWS('users',load);

  function close(){setModal(false);setEditing(null);setForm({name:'',email:'',password:'',role:'technician'});}
  function edit(u){setEditing(u);setForm({name:u.name,email:u.email,password:'',role:u.role});setModal(true);}

  async function save(){
    if(!form.name.trim()||!form.email.trim()||(!editing&&!form.password.trim())){toast('Name, email and password are required','err');return;}
    setSaving(true);
    try{
      if(editing) await api('/users/'+editing.id,{method:'PATCH',body:JSON.stringify({name:form.name,role:form.role})});
      else await api('/users/',{method:'POST',body:JSON.stringify(form)});
      toast(editing?'User updated':'User added');close();load();
    }
    catch(e){toast(e.message,'err');}
    finally{setSaving(false);}
  }

  async function togglePresent(u){
    setToggling(u.id);
    try{
      await api('/users/'+u.id,{method:'PATCH',body:JSON.stringify({is_present:!u.is_present})});
      toast((!u.is_present?'✅ Marked present: ':'❌ Marked absent: ')+u.name);
      load();
    }catch(e){toast(e.message,'err');}
    finally{setToggling(null);}
  }

  async function del(u){
    if(!confirm('Delete '+u.name+'?')) return;
    try{await api('/users/'+u.id,{method:'DELETE'});toast('User deleted');load();}
    catch(e){toast(e.message,'err');}
  }

  const presentCount=users.filter(u=>u.is_present).length;

  return <div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}}>
      <div><h1 style={{fontSize:'22px',fontWeight:800,color:'#1e293b',margin:0}}>Users</h1><p style={{color:'#94a3b8',fontSize:'13px',margin:'4px 0 0'}}>Add, edit, and manage staff attendance</p></div>
      <button className="btn btn-primary" onClick={()=>setModal(true)}>+ Add User</button>
    </div>

    {/* Attendance summary */}
    <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:'10px',padding:'12px 16px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'10px'}}>
      <span style={{fontSize:'20px'}}>🟢</span>
      <div>
        <div style={{fontWeight:700,color:'#166534',fontSize:'14px'}}>{presentCount} of {users.length} staff present today</div>
        <div style={{fontSize:'12px',color:'#16a34a'}}>Only present staff appear as assignable on the Alert Board</div>
      </div>
    </div>

    <div className="card" style={{padding:0}}>
      {loading?<Spinner/>:users.length===0?<Empty msg="No users found"/>:<div className="ovf"><table>
        <thead><tr>{['Name','Email','Role','Status','Present Today','Actions'].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>{users.map(u=>(
          <tr key={u.id}>
            <td style={{fontWeight:700}}>{u.name}</td>
            <td style={{color:'#64748b'}}>{u.email}</td>
            <td><Badge value={u.role}/></td>
            <td><Badge value={u.is_active?'active':'inactive'}/></td>
            <td>
              <button
                onClick={()=>togglePresent(u)}
                disabled={toggling===u.id}
                style={{
                  display:'inline-flex',alignItems:'center',gap:'5px',
                  padding:'4px 12px',borderRadius:'999px',fontSize:'12px',fontWeight:600,cursor:'pointer',
                  border: u.is_present?'1px solid #86efac':'1px solid #d1d5db',
                  background: u.is_present?'#dcfce7':'#f3f4f6',
                  color: u.is_present?'#166534':'#6b7280',
                  opacity: toggling===u.id?0.6:1,
                }}
              >
                {toggling===u.id?'...':(u.is_present?'✅ Present':'⬜ Absent')}
              </button>
            </td>
            <td>
              <button className="btn btn-secondary" style={{fontSize:'11px',padding:'3px 8px',marginRight:'6px'}} onClick={()=>edit(u)}>Edit</button>
              <button className="btn" style={{fontSize:'11px',padding:'3px 8px',background:'#fee2e2',color:'#991b1b'}} onClick={()=>del(u)}>Delete</button>
            </td>
          </tr>
        ))}</tbody>
      </table></div>}
    </div>

    {modal&&<Modal title={editing?'Edit User':'Add User'} onClose={close}><div style={{display:'grid',gap:'12px'}}>
      <div><label className="lbl">Name *</label><input className="inp" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
      <div><label className="lbl">Email *</label><input className="inp" type="email" value={form.email} disabled={!!editing} onChange={e=>setForm({...form,email:e.target.value})}/></div>
      {!editing&&<div><label className="lbl">Password *</label><input className="inp" type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})}/></div>}
      <div><label className="lbl">Role</label><select className="inp" value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>{['technician','manager','production','viewer','admin'].map(r=><option key={r} value={r}>{r}</option>)}</select></div>
      <div style={{display:'flex',gap:'10px',paddingTop:'4px'}}><button className="btn btn-primary" style={{flex:1}} onClick={save} disabled={saving}>{saving?'Saving...':'Save User'}</button><button className="btn btn-secondary" style={{flex:1}} onClick={close}>Cancel</button></div>
    </div></Modal>}
  </div>;
}

function App(){

  const [sidebarCollapsed,setSidebarCollapsed]=useState(()=>localStorage.getItem('cmms_sidebar_collapsed')==='1');
  useEffect(()=>{
    const token=localStorage.getItem('cmms_token');
    if(token) api('/auth/me').then(setUser).catch(()=>localStorage.removeItem('cmms_token'));
  },[]);
  function toggleSidebar(){
    setSidebarCollapsed(prev=>{
      const next=!prev;
      localStorage.setItem('cmms_sidebar_collapsed',next?'1':'0');
      return next;
    });
  }
  if(!user) return <Login onLogin={setUser}/>;
  const isAdminOrManager=user.role==='admin'||user.role==='manager';
  const visibleNav=NAV.filter(n=>n.key!=='users'||isAdminOrManager);
  const safePage=(page==='users'&&!isAdminOrManager)?'dashboard':page;
  const pages={dashboard:Dashboard,alert:MaintenanceAlertBoard,board:TechnicianBoard,history:HistoryLog,qr:QRPage,assets:Assets,inventory:InventoryAndStock,pm:PMSchedules,users:UsersManagement};
  const PageComp=pages[safePage]||Dashboard;
  return (
    <AuthCtx.Provider value={{user}}>
    <div>
      <div className={'sidebar'+(sidebarCollapsed?' collapsed':'')}>
        <div className="sidebar-toggle" onClick={toggleSidebar} title={sidebarCollapsed?'Expand sidebar':'Collapse sidebar'}>
          {sidebarCollapsed?'›':'‹'}
        </div>
        <div style={{padding:sidebarCollapsed?'20px 8px':'20px 16px',borderBottom:'1px solid #334155'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px',justifyContent:sidebarCollapsed?'center':'flex-start'}}>
            <div style={{width:'36px',height:'36px',background:'#2563eb',borderRadius:'10px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',flexShrink:0}}>🔧</div>
            <div className="brand-text"><div style={{color:'#fff',fontWeight:800,fontSize:'14px'}}>CMMS Pro</div><div style={{color:'#64748b',fontSize:'11px'}}>Maintenance System</div></div>
          </div>
        </div>
        <nav style={{flex:1,padding:'12px 8px'}}>
          {visibleNav.map(n=>(
            <div key={n.key} className={'nav-link'+(safePage===n.key?' active':'')} onClick={()=>setPage(n.key)} title={sidebarCollapsed?n.label:''}>
              <span>{n.icon}</span><span className="nav-label">{n.label}</span>
            </div>
          ))}
        </nav>
        <div style={{padding:sidebarCollapsed?'16px 8px':'16px',borderTop:'1px solid #334155'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px',justifyContent:sidebarCollapsed?'center':'flex-start'}}>
            <div style={{width:'32px',height:'32px',background:'#2563eb',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:'13px',flexShrink:0}}>
              {user.name?user.name.charAt(0).toUpperCase():'U'}
            </div>
            <div className="user-text"><div style={{color:'#fff',fontSize:'12px',fontWeight:600}}>{user.name}</div><div style={{color:'#64748b',fontSize:'11px',textTransform:'capitalize'}}>{user.role}</div></div>
          </div>
          <button className="signout-btn" onClick={()=>{localStorage.removeItem('cmms_token');setUser(null);}} style={{width:'100%',background:'none',border:'1px solid #334155',color:'#94a3b8',padding:'7px',borderRadius:'8px',cursor:'pointer',fontSize:'12px'}} title={sidebarCollapsed?'Sign out':''}>
            {sidebarCollapsed?'⏻':<span className="label">Sign out</span>}
          </button>
        </div>
      </div>
      <div className={'main-content'+(sidebarCollapsed?' collapsed':'')}><PageComp/></div>
    </div>
    </AuthCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
