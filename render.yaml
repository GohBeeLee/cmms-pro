# Render.com deployment config
# Place this file in your project ROOT folder

services:
  - type: web
    name: cmms-pro
    env: python
    region: malaysia
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_DIR
        value: ../frontend
